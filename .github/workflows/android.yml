              public static class MonitorSempreAtivoService extends Service {
                  private static final String CANAL_ID = "monitor_dados_24h";
                  private PowerManager.WakeLock wakeLock;
                  private WifiManager.WifiLock wifiLock;
                  private Handler handlerPulso;
                  private Runnable runnablePulso;

                  @Override
                  public void onCreate() {
                      super.onCreate();
                      iniciarNotificacaoDiscreta();
                      ativarLocks24h();
                      restaurarFirewallSalvo(getApplicationContext());
                      forcarAtualizacaoGpsImediata(getApplicationContext());
                      garantirMotorWebAtivo(getApplicationContext());
                      iniciarLoopNativoSegundoPlano();
                  }

                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      iniciarNotificacaoDiscreta();
                      ativarLocks24h();
                      restaurarFirewallSalvo(getApplicationContext());
                      iniciarRastreadorGpsNativo(getApplicationContext());
                      garantirMotorWebAtivo(getApplicationContext());
                      iniciarLoopNativoSegundoPlano();
                      agendarReativacaoAlarme();
                      return START_STICKY;
                  }

                  private void iniciarLoopNativoSegundoPlano() {
                      if (handlerPulso == null) {
                          handlerPulso = new Handler(Looper.getMainLooper());
                      }
                      if (runnablePulso == null) {
                          runnablePulso = new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      ativarLocks24h();
                                      acionarPulsoWebView(getApplicationContext());
                                  } catch (Throwable ignored) {}
                                  if (handlerPulso != null) {
                                      handlerPulso.postDelayed(this, 6000);
                                  }
                              }
                          };
                          handlerPulso.postDelayed(runnablePulso, 1500);
                      }
                  }

                  private void agendarReativacaoAlarme() {
                      try {
                          AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                          if (am != null) {
                              Intent i = new Intent(getApplicationContext(), BootReceiver.class);
                              int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  flags |= PendingIntent.FLAG_IMMUTABLE;
                              }
                              PendingIntent pi = PendingIntent.getBroadcast(getApplicationContext(), 909, i, flags);
                              am.setRepeating(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 60000, 60000, pi);
                          }
                      } catch (Throwable ignored) {}
                  }

                  private void iniciarNotificacaoDiscreta() {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                              NotificationChannel channel = new NotificationChannel(CANAL_ID, "Monitoramento 24h", NotificationManager.IMPORTANCE_LOW);
                              channel.setShowBadge(false);
                              nm.createNotificationChannel(channel);
                          }

                          Intent openIntent = new Intent(this, MainActivity.class);
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) { flags |= PendingIntent.FLAG_IMMUTABLE; }
                          PendingIntent pi = PendingIntent.getActivity(this, 0, openIntent, flags);

                          Notification.Builder builder = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ?
                                  new Notification.Builder(this, CANAL_ID) : new Notification.Builder(this);

                          Notification notif = builder
                                  .setContentTitle("Sistema de Dados Ativo")
                                  .setContentText("Sincronizado 24h")
                                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                                  .setContentIntent(pi)
                                  .setOngoing(true)
                                  .build();

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              try {
                                  startForeground(1001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                              } catch (Throwable e) {
                                  startForeground(1001, notif);
                              }
                          } else {
                              startForeground(1001, notif);
                          }
                      } catch (Throwable ignored) {}
                  }

                  private void ativarLocks24h() {
                      try {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          if (pm != null) {
                              if (wakeLock == null) {
                                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "MonitorDados::SempreAtivoLock");
                                  wakeLock.setReferenceCounted(false);
                              }
                              if (!wakeLock.isHeld()) {
                                  wakeLock.acquire();
                              }
                          }
                      } catch (Throwable ignored) {}

                      try {
                          WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                          if (wm != null) {
                              if (wifiLock == null) {
                                  wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "MonitorDados::WifiSempreAtivo");
                                  wifiLock.setReferenceCounted(false);
                              }
                              if (!wifiLock.isHeld()) {
                                  wifiLock.acquire();
                              }
                          }
                      } catch (Throwable ignored) {}
                  }

                  @Override
                  public void onTaskRemoved(Intent rootIntent) {
                      agendarReativacaoAlarme();
                      iniciarServico24h(getApplicationContext());
                      super.onTaskRemoved(rootIntent);
                  }

                  @Override
                  public void onDestroy() {
                      agendarReativacaoAlarme();
                      iniciarServico24h(getApplicationContext());
                      super.onDestroy();
                  }

                  @Override
                  public IBinder onBind(Intent intent) { return null; }
              }

              public static class FirewallVpnService extends VpnService {
                  private static ParcelFileDescriptor vpnInterface = null;
                  public static volatile boolean bloqueioGeralAtivo = false;
                  public static final List<String> listaAppsBloqueados = new ArrayList<>();
                  public static final List<String> listaAppsLiberadosExcecao = new ArrayList<>();

                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      if (intent != null && "PARAR".equals(intent.getAction())) {
                          fecharTunel();
                          stopSelf();
                          return START_NOT_STICKY;
                      }
                      aplicarRegrasVpn();
                      return START_STICKY;
                  }

                  private synchronized void aplicarRegrasVpn() {
                      fecharTunel();
                      List<String> copiaBloq;
                      List<String> copiaLib;
                      synchronized (listaAppsBloqueados) {
                          copiaBloq = new ArrayList<>(listaAppsBloqueados);
                      }
                      synchronized (listaAppsLiberadosExcecao) {
                          copiaLib = new ArrayList<>(listaAppsLiberadosExcecao);
                      }

                      if (!bloqueioGeralAtivo && copiaBloq.isEmpty()) {
                          stopSelf();
                          return;
                      }
                      try {
                          Builder builder = new Builder();
                          builder.setSession("Firewall Central Monitor");
                          builder.setMtu(1500);
                          builder.addAddress("10.111.222.1", 32);
                          builder.addRoute("0.0.0.0", 0);
                          builder.addDnsServer("10.111.222.2");

                          try {
                              builder.addAddress("fd00:1:fd00:1:fd00:1:fd00:1", 128);
                              builder.addRoute("::", 0);
                          } catch (Throwable ignored) {}

                          if (bloqueioGeralAtivo) {
                              // Bloqueia TODOS os aplicativos do celular, EXCETO o Monitor e os apps que foram liberados na Central!
                              try { builder.addDisallowedApplication(getPackageName()); } catch (Throwable ignored) {}
                              for (String pkgLib : copiaLib) {
                                  if (pkgLib != null && !pkgLib.trim().isEmpty()) {
                                      try { builder.addDisallowedApplication(pkgLib.trim()); } catch (Throwable ignored) {}
                                  }
                              }
                          } else {
                              // Modo individual: bloqueia apenas os aplicativos selecionados na listaAppsBloqueados
                              int adicionados = 0;
                              for (String pkg : copiaBloq) {
                                  if (pkg != null && !pkg.trim().isEmpty() && !pkg.equals(getPackageName())) {
                                      try { builder.addAllowedApplication(pkg.trim()); adicionados++; } catch (Throwable ignored) {}
                                  }
                              }
                              if (adicionados == 0) { stopSelf(); return; }
                          }
                          vpnInterface = builder.establish();
                      } catch (Throwable e) { fecharTunel(); }
                  }

                  private synchronized void fecharTunel() {
                      if (vpnInterface != null) {
                          try { vpnInterface.close(); } catch (IOException ignored) {}
                          vpnInterface = null;
                      }
                  }

                  @Override
                  public void onDestroy() {
                      fecharTunel();
                      super.onDestroy();
                  }
              }

