name: Gerar 2 APKs - Monitor e Central

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Android SDK e Gradle
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Gradle 7.6
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '7.6.4'

      - name: 5. Preparar estrutura base do projeto Android
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/example/monitordados
          mkdir -p APKs-Prontos

          if [ -f "central.html" ] && [ ! -f "app/src/main/assets/central.html" ]; then
            cp central.html app/src/main/assets/central.html
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonitorFrota"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.monitordados'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.monitordados"
                  minSdk 23
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

      - name: 6. Compilar APK 1 - Monitor de Dados
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Monitor-Dados.apk

      - name: 7. Compilar APK 2 - Painel Central
        run: |
          if [ -f "app/src/main/assets/central.html" ]; then
            cp app/src/main/assets/central.html app/src/main/assets/index.html
          fi

          sed -i 's/applicationId "com.example.monitordados"/applicationId "com.example.painelcentral"/g' app/build.gradle
          sed -i 's/android:label="Monitor de Dados"/android:label="Painel Central"/g' app/src/main/AndroidManifest.xml

          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Painel-Central.apk

      - name: 8. Publicar os 2 APKs para Download
        uses: actions/upload-artifact@v4
        with:
          name: APKs-Monitor-e-Central
          path: APKs-Prontos/*.apk
