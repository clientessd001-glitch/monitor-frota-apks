              private static long calcularInicioCiclo(int diaRenovacao) {
                  Calendar cal = Calendar.getInstance();
                  int diaAtual = cal.get(Calendar.DAY_OF_MONTH);
                  int diaAjustado = Math.max(1, Math.min(28, diaRenovacao));
                  if (diaAtual < diaAjustado) { cal.add(Calendar.MONTH, -1); }
                  cal.set(Calendar.DAY_OF_MONTH, diaAjustado);
                  cal.set(Calendar.HOUR_OF_DAY, 0);
                  cal.set(Calendar.MINUTE, 0);
                  cal.set(Calendar.SECOND, 0);
                  cal.set(Calendar.MILLISECOND, 0);
                  return cal.getTimeInMillis();
              }

              public static boolean temPermissaoUsoStatic(Context context) {
                  try {
                      AppOpsManager appOps = (AppOpsManager) context.getSystemService(Context.APP_OPS_SERVICE);
                      if (appOps == null) return false;
                      int mode = appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), context.getPackageName());
                      return mode == AppOpsManager.MODE_ALLOWED;
                  } catch (Throwable e) { return false; }
              }

              public static double obterConsumoTotalMesGBStatic(Context context, int diaRenovacao) {
                  long inicio = calcularInicioCiclo(diaRenovacao);
                  long agora = System.currentTimeMillis();
                  long totalBytes = 0;
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && temPermissaoUsoStatic(context)) {
                          NetworkStatsManager nsm = (NetworkStatsManager) context.getSystemService(Context.NETWORK_STATS_SERVICE);
                          if (nsm != null) {
                              NetworkStats.Bucket bucket = nsm.querySummaryForDevice(ConnectivityManager.TYPE_MOBILE, null, inicio, agora);
                              if (bucket != null) { totalBytes = bucket.getRxBytes() + bucket.getTxBytes(); }
                          }
                      }
                  } catch (Throwable ignored) {}

                  if (totalBytes <= 0) {
                      long rx = TrafficStats.getMobileRxBytes();
                      long tx = TrafficStats.getMobileTxBytes();
                      if (rx != TrafficStats.UNSUPPORTED && tx != TrafficStats.UNSUPPORTED) { totalBytes = rx + tx; }
                  }
                  return totalBytes / (1024.0 * 1024.0 * 1024.0);
              }

              public static String obterTipoRedeStatic(Context context) {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) context.getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return "Desconectado";
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          Network net = cm.getActiveNetwork();
                          if (net == null) return "Dados Desligados";
                          NetworkCapabilities caps = cm.getNetworkCapabilities(net);
                          if (caps == null) return "Dados Desligados";
                          if (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) { return "Wi-Fi Ativo"; }
                          else if (caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)) { return "4G/5G Movel"; }
                      }
                  } catch (Throwable ignored) {}
                  return "Dados Moveis";
              }

              public static double obterVelocidadeMbpsStatic() {
                  long agora = System.currentTimeMillis();
                  long rxAtual = TrafficStats.getTotalRxBytes();
                  long txAtual = TrafficStats.getTotalTxBytes();
                  if (ultimoTempoLeitura > 0 && (agora - ultimoTempoLeitura) > 500) {
                      long deltaBytes = (rxAtual - ultimoRxBytesTotal) + (txAtual - ultimoTxBytesTotal);
                      double segundos = (agora - ultimoTempoLeitura) / 1000.0;
                      if (deltaBytes >= 0 && segundos > 0) {
                          double mbpsInstantaneo = (deltaBytes * 8.0) / (segundos * 1000000.0);
                          if (mbpsInstantaneo > 0.05) { ultimaVelocidadeMbps = mbpsInstantaneo; }
                      }
                  }
                  ultimoRxBytesTotal = rxAtual;
                  ultimoTxBytesTotal = txAtual;
                  ultimoTempoLeitura = agora;
                  return Math.round(ultimaVelocidadeMbps * 100.0) / 100.0;
              }

              public static JSONArray obterAppsInstaladosArrayStatic(Context context, int diaRenovacao, boolean bloqGeral, JSONObject mapaBloq, JSONObject mapaLib) {
                  JSONArray listaApps = new JSONArray();
                  try {
                      PackageManager pm = context.getPackageManager();
                      String redeAtual = obterTipoRedeStatic(context);
                      List<PackageInfo> pacotes = pm.getInstalledPackages(PackageManager.GET_PERMISSIONS);
                      List<JSONObject> tempObjs = new ArrayList<>();

                      for (PackageInfo pkg : pacotes) {
                          ApplicationInfo appInfo = pkg.applicationInfo;
                          if (appInfo == null) continue;
                          boolean ehAppUsuario = (appInfo.flags & ApplicationInfo.FLAG_SYSTEM) == 0
                                  || (appInfo.flags & ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0
                                  || pm.getLaunchIntentForPackage(pkg.packageName) != null;
                          if (!ehAppUsuario) continue;

                          int uid = appInfo.uid;
                          String nomeApp = pm.getApplicationLabel(appInfo).toString();
                          long rxUid = TrafficStats.getUidRxBytes(uid);
                          long txUid = TrafficStats.getUidTxBytes(uid);
                          long totalBytes = (rxUid > 0 || txUid > 0) ? (rxUid + txUid) : 0;

                          boolean solicitaGeo = false;
                          if (pkg.requestedPermissions != null) {
                              for (String perm : pkg.requestedPermissions) {
                                  if (Manifest.permission.ACCESS_FINE_LOCATION.equals(perm)) { solicitaGeo = true; break; }
                              }
                          }

                          boolean libExcecao = mapaLib != null && mapaLib.optBoolean(pkg.packageName, false);
                          boolean blqIndiv = mapaBloq != null && mapaBloq.optBoolean(pkg.packageName, false);
                          boolean estaBloq = bloqGeral ? !libExcecao : blqIndiv;

                          double totalMB = totalBytes / (1024.0 * 1024.0);
                          JSONObject obj = new JSONObject();
                          obj.put("nome", nomeApp);
                          obj.put("pacote", pkg.packageName);
                          obj.put("totalMB", Math.round(totalMB * 10.0) / 10.0);
                          obj.put("redeAtiva", estaBloq ? "🚫 Bloqueado" : ("Conectado (" + redeAtual + ")"));
                          obj.put("emTransmissao", !estaBloq && totalMB > 0);
                          obj.put("usaGeo", solicitaGeo);
                          obj.put("geoAtiva", solicitaGeo);
                          obj.put("bloqueado", estaBloq);
                          obj.put("bloqueadoIndividual", blqIndiv);
                          obj.put("liberadoExcecao", libExcecao);
                          tempObjs.add(obj);
                      }

                      Collections.sort(tempObjs, new Comparator<JSONObject>() {
                          @Override
                          public int compare(JSONObject a, JSONObject b) {
                              return Double.compare(b.optDouble("totalMB", 0), a.optDouble("totalMB", 0));
                          }
                      });

                      int limite = Math.min(tempObjs.size(), 40);
                      for (int i = 0; i < limite; i++) { listaApps.put(tempObjs.get(i)); }
                  } catch (Throwable ignored) {}
                  return listaApps;
              }

