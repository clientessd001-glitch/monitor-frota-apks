          public class MainActivity extends Activity {

              private static final int REQ_PERMISSOES = 101;
              private static final int REQ_VPN = 102;
              private static final int REQ_BG_LOCATION = 103;
              private static final String PREFS_NAME = "MonitorFrotaPrefs";
              private static final String FIREBASE_URL = "https://painel-2d29e-default-rtdb.firebaseio.com";

              public static MutableContextWrapper contextWrapperGlobal = null;
              public static WebViewSempreAtivo webViewGlobal = null;
              public static MainActivity instanciaAtiva = null;

              private static final ExecutorService executorFirebaseNativo = Executors.newSingleThreadExecutor();
              private static volatile double ultimaVelocidadeMbps = 0.0;
              private static volatile int ultimaLatenciaMs = 22;
              private static long ultimoRxBytesTotal = 0;
              private static long ultimoTxBytesTotal = 0;
              private static long ultimoTempoLeitura = 0;

              // Estado em tempo real de GPS Dinamico e Endereco
              private static volatile double melhorLat = 0.0;
              private static volatile double melhorLon = 0.0;
              private static volatile float melhorPrecisaoMetros = 99999f;
              private static volatile long ultimoTempoGps = 0L;
              private static volatile long ultimoTimestampSatelite = 0L;
              private static volatile long ultimoGpsForcadoTs = 0L;
              private static volatile String cidadeDetectadaCache = "";
              private static volatile String enderecoDetectadoCache = "";
              private static double ultimaLatGeocodificada = 0.0;
              private static double ultimaLonGeocodificada = 0.0;
              private static long ultimoTempoGeocoder = 0L;
              private static LocationListener listenerGpsAtivo = null;
              private static long ultimoRegistroListenerMs = 0L;

              public static boolean ehAppCentral(Context context) {
                  if (context == null || context.getPackageName() == null) return false;
                  return context.getPackageName().contains("painelcentral");
              }

              public static SharedPreferences getPrefs(Context context) {
                  return context.getApplicationContext().getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
              }

              public static synchronized String obterOuCriarDeviceId(Context context) {
                  SharedPreferences prefs = getPrefs(context);
                  String id = prefs.getString("deviceId_v6", "");
                  if (id == null || id.trim().isEmpty()) {
                      String chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                      Random rnd = new Random();
                      StringBuilder sb = new StringBuilder("CEL-");
                      for (int i = 0; i < 4; i++) {
                          sb.append(chars.charAt(rnd.nextInt(chars.length())));
                      }
                      id = sb.toString();
                      prefs.edit().putString("deviceId_v6", id).apply();
                  }
                  return id;
              }

              public static synchronized String obterOuCriarNomeAparelho(Context context) {
                  SharedPreferences prefs = getPrefs(context);
                  String nome = prefs.getString("nomeAparelho_v6", "");
                  if (nome == null || nome.trim().isEmpty()) {
                      String modelo = Build.MODEL != null && !Build.MODEL.trim().isEmpty() ? Build.MODEL.trim() : "Android";
                      nome = modelo + " • " + obterOuCriarDeviceId(context);
                      prefs.edit().putString("nomeAparelho_v6", nome).apply();
                  }
                  return nome;
              }

              public static JSONObject csvParaJsonMapa(String csv) {
                  JSONObject obj = new JSONObject();
                  if (csv == null || csv.trim().isEmpty()) return obj;
                  String[] partes = csv.split(",");
                  for (String p : partes) {
                      String limpo = p != null ? p.trim() : "";
                      if (!limpo.isEmpty()) {
                          try { obj.put(limpo, true); } catch (Throwable ignored) {}
                      }
                  }
                  return obj;
              }

              public static String jsonMapaParaCsv(JSONObject mapa) {
                  if (mapa == null) return "";
                  List<String> lista = new ArrayList<>();
                  Iterator<String> keys = mapa.keys();
                  while (keys.hasNext()) {
                      String k = keys.next();
                      if (k != null && !k.trim().isEmpty() && mapa.optBoolean(k, false)) {
                          lista.add(k.trim());
                      }
                  }
                  Collections.sort(lista);
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < lista.size(); i++) {
                      if (i > 0) sb.append(",");
                      sb.append(lista.get(i));
                  }
                  return sb.toString();
              }

              public static boolean temPermissaoGpsSegundoPlanoStatic(Context context) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return true;
                  boolean fine = context.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                  boolean coarse = context.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                  if (!fine && !coarse) return false;
                  if (Build.VERSION.SDK_INT >= 29) {
                      return context.checkSelfPermission(Manifest.permission.ACCESS_BACKGROUND_LOCATION) == PackageManager.PERMISSION_GRANTED;
                  }
                  return true;
              }

              public static synchronized void registrarCoordenadaPrecisa(Context context, double lat, double lon, float precisao) {
                  registrarCoordenadaInterna(context, lat, lon, precisao, System.currentTimeMillis(), true);
              }

              public static synchronized void registrarCoordenadaInterna(Context context, double lat, double lon, float precisao, long tempoFix, boolean ehAoVivo) {
                  if (lat == 0.0 && lon == 0.0) return;
                  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return;

                  long agora = System.currentTimeMillis();
                  float acc = (precisao > 0f) ? precisao : 25f;

                  if (!ehAoVivo) {
                      if (melhorLat != 0.0 && tempoFix <= ultimoTimestampSatelite) {
                          return;
                      }
                      // Se o servico acabou de iniciar no boot (ultimoTempoGps == 0), aceita o fix mais recente dos provedores
                      if (melhorLat != 0.0 && ultimoTempoGps > 0L && (agora - tempoFix) > 120000L) {
                          return;
                      }
                  } else {
                      if (melhorLat != 0.0 && (agora - ultimoTempoGps) < 10000L && acc > 200f && melhorPrecisaoMetros < 25f) {
                          return;
                      }
                  }

                  double deslocamentoGraus = Math.abs(lat - melhorLat) + Math.abs(lon - melhorLon);
                  melhorLat = lat;
                  melhorLon = lon;
                  melhorPrecisaoMetros = acc;
                  ultimoTempoGps = agora;
                  if (tempoFix > 0) {
                      ultimoTimestampSatelite = Math.max(ultimoTimestampSatelite, tempoFix);
                  }

                  try {
                      SharedPreferences.Editor ed = getPrefs(context).edit();
                      ed.putString("gps_lat_exata", String.valueOf(lat));
                      ed.putString("gps_lon_exata", String.valueOf(lon));
                      if (deslocamentoGraus >= 0.00015) {
                          ultimoTempoGeocoder = 0L;
                      }
                      ed.apply();
                  } catch (Throwable ignored) {}
              }

              public static void forcarAtualizacaoGpsImediata(final Context context) {
                  final Context appCtx = context.getApplicationContext();
                  if (ehAppCentral(appCtx)) return;

                  ultimoTimestampSatelite = 0L;
                  ultimoTempoGeocoder = 0L;
                  ultimaLatGeocodificada = 0.0;
                  ultimaLonGeocodificada = 0.0;
                  ultimoRegistroListenerMs = 0L;
                  ultimoGpsForcadoTs = System.currentTimeMillis();

                  new Handler(Looper.getMainLooper()).post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              iniciarRastreadorGpsNativo(appCtx);
                              if (webViewGlobal != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                                  webViewGlobal.evaluateJavascript("try { if (typeof window.forcarLeituraGpsFresca === 'function') { window.forcarLeituraGpsFresca(); } } catch(e) {}", null);
                              }
                          } catch (Throwable ignored) {}
                      }
                  });
              }

              public static void iniciarRastreadorGpsNativo(final Context context) {
                  final Context appCtx = context.getApplicationContext();
                  if (ehAppCentral(appCtx)) return;

                  if (melhorLat == 0.0 && melhorLon == 0.0) {
                      try {
                          SharedPreferences prefs = getPrefs(appCtx);
                          double sLat = Double.parseDouble(prefs.getString("gps_lat_exata", "0"));
                          double sLon = Double.parseDouble(prefs.getString("gps_lon_exata", "0"));
                          String sCid = prefs.getString("gps_cidade_real", "");
                          String sEnd = prefs.getString("gps_endereco_real", "");
                          if (sLat != 0.0 || sLon != 0.0) {
                              melhorLat = sLat;
                              melhorLon = sLon;
                          }
                          if (sCid != null && !sCid.isEmpty()) cidadeDetectadaCache = sCid;
                          if (sEnd != null && !sEnd.isEmpty()) enderecoDetectadoCache = sEnd;
                      } catch (Throwable ignored) {}
                  }

                  new Handler(Looper.getMainLooper()).post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                                      appCtx.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                                      appCtx.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                                  return;
                              }

                              LocationManager lm = (LocationManager) appCtx.getSystemService(Context.LOCATION_SERVICE);
                              if (lm == null) return;

                              String[] provedores = new String[]{
                                      LocationManager.GPS_PROVIDER,
                                      LocationManager.NETWORK_PROVIDER,
                                      LocationManager.PASSIVE_PROVIDER,
                                      "fused"
                              };
                              Location maisNova = null;
                              for (String prov : provedores) {
                                  try {
                                      Location l = lm.getLastKnownLocation(prov);
                                      if (l != null && (maisNova == null || l.getTime() > maisNova.getTime())) {
                                          maisNova = l;
                                      }
                                  } catch (Throwable ignored) {}
                              }

                              if (maisNova != null) {
                                  registrarCoordenadaInterna(appCtx, maisNova.getLatitude(), maisNova.getLongitude(), maisNova.getAccuracy(), maisNova.getTime(), false);
                              }

                              long agora = System.currentTimeMillis();
                              // Se passou mais de 20s sem registrar listener ou se o GPS nao atualizou nos ultimos 20s (ex: pos-boot), renova o registro dos sensores
                              if (listenerGpsAtivo == null || (agora - ultimoRegistroListenerMs) > 20000L || (agora - ultimoTempoGps) > 20000L) {
                                  ultimoRegistroListenerMs = agora;
                                  if (listenerGpsAtivo == null) {
                                      listenerGpsAtivo = new LocationListener() {
                                          @Override
                                          public void onLocationChanged(Location loc) {
                                              if (loc != null) {
                                                  registrarCoordenadaInterna(appCtx, loc.getLatitude(), loc.getLongitude(), loc.getAccuracy(), loc.getTime(), true);
                                              }
                                          }
                                          @Override public void onStatusChanged(String p, int s, Bundle b) {}
                                          @Override public void onProviderEnabled(String p) {}
                                          @Override public void onProviderDisabled(String p) {}
                                      };
                                  }

                                  for (String prov : provedores) {
                                      try {
                                          lm.requestLocationUpdates(prov, 2000L, 0f, listenerGpsAtivo, Looper.getMainLooper());
                                      } catch (Throwable ignored) {}
                                  }
                              }
                          } catch (Throwable ignored) {}
                      }
                  });
              }

              private static String abreviarEstadoBrasil(String estado) {
                  if (estado == null) return "";
                  String e = estado.trim().toLowerCase(Locale.ROOT);
                  if (e.length() == 2) return estado.toUpperCase(Locale.ROOT);
                  if (e.contains("cear")) return "CE";
                  if (e.contains("paulo")) return "SP";
                  if (e.contains("janeiro")) return "RJ";
                  if (e.contains("gerais")) return "MG";
                  if (e.contains("bahia")) return "BA";
                  if (e.contains("pernambuco")) return "PE";
                  if (e.contains("para") && !e.contains("parana") && !e.contains("paraiba")) return "PA";
                  if (e.contains("paran")) return "PR";
                  if (e.contains("paraíba") || e.contains("paraiba")) return "PB";
                  if (e.contains("grande do norte")) return "RN";
                  if (e.contains("grande do sul")) return "RS";
                  if (e.contains("catarina")) return "SC";
                  if (e.contains("goi")) return "GO";
                  if (e.contains("maranh")) return "MA";
                  if (e.contains("piau")) return "PI";
                  if (e.contains("alagoas")) return "AL";
                  if (e.contains("sergipe")) return "SE";
                  if (e.contains("amazonas")) return "AM";
                  if (e.contains("espírito") || e.contains("espirito")) return "ES";
                  if (e.contains("mato grosso do sul")) return "MS";
                  if (e.contains("mato grosso")) return "MT";
                  if (e.contains("distrito federal") || e.contains("brasília") || e.contains("brasilia")) return "DF";
                  if (e.contains("tocantins")) return "TO";
                  if (e.contains("rond")) return "RO";
                  if (e.contains("acre")) return "AC";
                  if (e.contains("amap")) return "AP";
                  if (e.contains("roraima")) return "RR";
                  return estado;
              }

              private static void salvarCacheEndereco(Context appCtx, double lat, double lon, String cidFormatada, String endFormatado) {
                  cidadeDetectadaCache = cidFormatada;
                  enderecoDetectadoCache = endFormatado;
                  ultimaLatGeocodificada = lat;
                  ultimaLonGeocodificada = lon;
                  ultimoTempoGeocoder = System.currentTimeMillis();

                  SharedPreferences.Editor ed = getPrefs(appCtx).edit();
                  ed.putString("gps_cidade_real", cidadeDetectadaCache);
                  ed.putString("gps_endereco_real", enderecoDetectadoCache);
                  ed.apply();
              }

              private static void atualizarCidadeEEnderecoPorCoordenada(Context appCtx, double lat, double lon) {
                  if (lat == 0.0 && lon == 0.0) return;

                  long agora = System.currentTimeMillis();
                  double distMudanca = Math.abs(lat - ultimaLatGeocodificada) + Math.abs(lon - ultimaLonGeocodificada);
                  if (!cidadeDetectadaCache.isEmpty() && distMudanca < 0.00015 && (agora - ultimoTempoGeocoder) < 25000L) {
                      return;
                  }

                  // 1. Tenta o Geocoder Nativo do Android
                  try {
                      if (Geocoder.isPresent()) {
                          Geocoder geocoder = new Geocoder(appCtx, new Locale("pt", "BR"));
                          List<Address> ends = geocoder.getFromLocation(lat, lon, 1);
                          if (ends != null && !ends.isEmpty()) {
                              Address a = ends.get(0);
                              String cidade = a.getLocality();
                              if (cidade == null || cidade.trim().isEmpty()) {
                                  cidade = a.getSubAdminArea();
                              }
                              String bairro = a.getSubLocality();
                              String uf = abreviarEstadoBrasil(a.getAdminArea());
                              String rua = a.getThoroughfare();
                              String numero = a.getSubThoroughfare();

                              if (cidade != null && !cidade.trim().isEmpty()) {
                                  StringBuilder sbCidade = new StringBuilder();
                                  if (bairro != null && !bairro.trim().isEmpty() && !bairro.equalsIgnoreCase(cidade)) {
                                      sbCidade.append(bairro.trim()).append(" • ");
                                  }
                                  sbCidade.append(cidade.trim());
                                  if (uf != null && !uf.isEmpty()) {
                                      sbCidade.append(" - ").append(uf);
                                  }

                                  StringBuilder sbEnd = new StringBuilder();
                                  if (rua != null && !rua.trim().isEmpty()) {
                                      sbEnd.append(rua.trim());
                                      if (numero != null && !numero.trim().isEmpty()) {
                                          sbEnd.append(", ").append(numero.trim());
                                      }
                                      sbEnd.append(" - ");
                                  }
                                  sbEnd.append(sbCidade.toString());

                                  salvarCacheEndereco(appCtx, lat, lon, sbCidade.toString(), sbEnd.toString());
                                  return;
                              }
                          }
                      }
                  } catch (Throwable ignored) {}

                  // 2. Fallback de Alta Precisao (Rua + Bairro + Cidade) via OpenStreetMap Nominatim
                  try {
                      String urlNom = String.format(Locale.US,
                              "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=%.7f&lon=%.7f&zoom=18&addressdetails=1&accept-language=pt-BR",
                              lat, lon);
                      String respNom = requisicaoHttpFirebase(urlNom, "GET", null);
                      if (respNom != null && respNom.startsWith("{")) {
                          JSONObject nom = new JSONObject(respNom);
                          JSONObject addr = nom.optJSONObject("address");
                          if (addr != null) {
                              String rua = addr.optString("road", addr.optString("pedestrian", ""));
                              String numero = addr.optString("house_number", "");
                              String bairro = addr.optString("suburb", addr.optString("neighbourhood", addr.optString("city_district", "")));
                              String cidade = addr.optString("city", addr.optString("town", addr.optString("municipality", addr.optString("village", ""))));
                              String uf = abreviarEstadoBrasil(addr.optString("state", ""));

                              if (!cidade.isEmpty()) {
                                  StringBuilder sbCid = new StringBuilder();
                                  if (!bairro.isEmpty() && !bairro.equalsIgnoreCase(cidade)) {
                                      sbCid.append(bairro).append(" • ");
                                  }
                                  sbCid.append(cidade);
                                  if (!uf.isEmpty()) sbCid.append(" - ").append(uf);

                                  StringBuilder sbEnd = new StringBuilder();
                                  if (!rua.isEmpty()) {
                                      sbEnd.append(rua);
                                      if (!numero.isEmpty()) sbEnd.append(", ").append(numero);
                                      sbEnd.append(" - ");
                                  }
                                  sbEnd.append(sbCid.toString());

                                  salvarCacheEndereco(appCtx, lat, lon, sbCid.toString(), sbEnd.toString());
                                  return;
                              }
                          }
                      }
                  } catch (Throwable ignored) {}

                  // 3. Fallback secundario via BigDataCloud
                  try {
                      String urlApi = String.format(Locale.US,
                              "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=%.7f&longitude=%.7f&localityLanguage=pt",
                              lat, lon);
                      String resp = requisicaoHttpFirebase(urlApi, "GET", null);
                      if (resp != null && resp.startsWith("{")) {
                          JSONObject geo = new JSONObject(resp);
                          String cid = geo.optString("city", "");
                          if (cid.isEmpty()) cid = geo.optString("locality", "");
                          String bairro = geo.optString("locality", "");
                          String estado = abreviarEstadoBrasil(geo.optString("principalSubdivision", ""));

                          if (!cid.isEmpty()) {
                              StringBuilder sb = new StringBuilder();
                              if (!bairro.isEmpty() && !bairro.equalsIgnoreCase(cid)) {
                                  sb.append(bairro).append(" • ");
                              }
                              sb.append(cid);
                              if (!estado.isEmpty()) sb.append(" - ").append(estado);

                              salvarCacheEndereco(appCtx, lat, lon, sb.toString(), sb.toString());
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              public static class WebViewSempreAtivo extends WebView {
                  public WebViewSempreAtivo(Context context) {
                      super(context);
                  }
                  @Override
                  protected void onWindowVisibilityChanged(int visibility) {
                      super.onWindowVisibilityChanged(View.VISIBLE);
                  }
              }

              private static boolean tratarUrlExterna(Context ctx, String url) {
                  if (url == null || url.isEmpty()) return false;
                  if (url.startsWith("file:///")) return false;

                  try {
                      if (url.startsWith("intent://")) {
                          Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                          if (intent != null) {
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              try {
                                  ctx.startActivity(intent);
                                  return true;
                              } catch (Throwable e) {
                                  String fallbackUrl = intent.getStringExtra("browser_fallback_url");
                                  if (fallbackUrl != null && !fallbackUrl.isEmpty()) {
                                      Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(fallbackUrl));
                                      browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      ctx.startActivity(browserIntent);
                                      return true;
                                  }
                              }
                          }
                          return true;
                      }

                      if (url.startsWith("geo:") || url.contains("google.com/maps")) {
                          Intent mapIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          mapIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(mapIntent);
                          return true;
                      }
                  } catch (Throwable ignored) {}
                  return false;
              }

              public static synchronized void garantirMotorWebAtivo(final Context context) {
                  final Context appCtx = context.getApplicationContext();
                  if (Looper.myLooper() != Looper.getMainLooper()) {
                      new Handler(Looper.getMainLooper()).post(new Runnable() {
                          @Override
                          public void run() {
                              garantirMotorWebAtivo(context);
                          }
                      });
                      return;
                  }

                  if (contextWrapperGlobal == null) {
                      contextWrapperGlobal = new MutableContextWrapper(context instanceof Activity ? context : appCtx);
                  } else if (context instanceof Activity) {
                      contextWrapperGlobal.setBaseContext(context);
                  }

                  if (webViewGlobal == null) {
                      webViewGlobal = new WebViewSempreAtivo(contextWrapperGlobal);
                      WebSettings settings = webViewGlobal.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setGeolocationEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN_MR1) {
                          settings.setMediaPlaybackRequiresUserGesture(false);
                      }

                      webViewGlobal.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              return tratarUrlExterna(appCtx, url);
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP && request != null && request.getUrl() != null) {
                                  return tratarUrlExterna(appCtx, request.getUrl().toString());
                              }
                              return false;
                          }
                      });

                      webViewGlobal.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                              callback.invoke(origin, true, false);
                          }
                      });

                      webViewGlobal.addJavascriptInterface(new PonteMonitorDados(appCtx), "AndroidMonitor");
                      webViewGlobal.loadUrl("file:///android_asset/index.html");
                  }

                  webViewGlobal.onResume();
                  webViewGlobal.resumeTimers();
              }

              public static void acionarPulsoWebView(final Context context) {
                  if (!ehAppCentral(context)) {
                      iniciarRastreadorGpsNativo(context.getApplicationContext());
                      dispararSincronizacaoFirebaseNativa(context.getApplicationContext());
                  }
                  new Handler(Looper.getMainLooper()).post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              garantirMotorWebAtivo(context);
                              if (webViewGlobal != null) {
                                  webViewGlobal.onResume();
                                  webViewGlobal.resumeTimers();
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                                      webViewGlobal.evaluateJavascript("try { if (typeof window.pulsoNativoSegundoPlano === 'function') { window.pulsoNativoSegundoPlano(); } } catch(e) {}", null);
                                  } else {
                                      webViewGlobal.loadUrl("javascript:try{if(typeof window.pulsoNativoSegundoPlano==='function'){window.pulsoNativoSegundoPlano();}}catch(e){}");
                                  }
                              }
                          } catch (Throwable ignored) {}
                      }
                  });
              }

              private static String requisicaoHttpFirebase(String urlStr, String metodo, String jsonBody) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(urlStr);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setConnectTimeout(6000);
                      conn.setReadTimeout(6000);
                      conn.setRequestMethod(metodo);
                      conn.setRequestProperty("Accept", "application/json");
                      conn.setRequestProperty("User-Agent", "MonitorDadosFrota/10.4 (Android)");
                      if (jsonBody != null) {
                          conn.setDoOutput(true);
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          byte[] bytes = jsonBody.getBytes(StandardCharsets.UTF_8);
                          OutputStream os = conn.getOutputStream();
                          os.write(bytes);
                          os.flush();
                          os.close();
                      }
                      int code = conn.getResponseCode();
                      InputStream is = (code >= 200 && code < 300) ? conn.getInputStream() : conn.getErrorStream();
                      if (is == null) return null;
                      BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      String linha;
                      while ((linha = br.readLine()) != null) {
                          sb.append(linha);
                      }
                      br.close();
                      return (code >= 200 && code < 300) ? sb.toString() : null;
                  } catch (Throwable e) {
                      return null;
                  } finally {
                      if (conn != null) {
                          try { conn.disconnect(); } catch (Throwable ignored) {}
                      }
                  }
              }

              public static void restaurarFirewallSalvo(Context context) {
                  try {
                      if (ehAppCentral(context)) return;
                      SharedPreferences prefs = getPrefs(context);
                      boolean fwGeral = "true".equals(prefs.getString("firewallGeral_v7", "false"));
                      JSONObject appsBloq = new JSONObject(prefs.getString("appsBloqueados_v7", "{}"));
                      JSONObject appsLib = new JSONObject(prefs.getString("appsLiberados_v10", "{}"));
                      if (fwGeral || appsBloq.length() > 0) {
                          aplicarFirewallNativo(context.getApplicationContext(), fwGeral, appsBloq, appsLib);
                      }
                  } catch (Throwable ignored) {}
              }

              public static void aplicarFirewallNativo(Context context, boolean bloquearGeral, JSONObject mapaAppsBloq, JSONObject mapaAppsLib) {
                  try {
                      FirewallVpnService.bloqueioGeralAtivo = bloquearGeral;
                      synchronized (FirewallVpnService.listaAppsBloqueados) {
                          FirewallVpnService.listaAppsBloqueados.clear();
                          if (mapaAppsBloq != null) {
                              Iterator<String> keys = mapaAppsBloq.keys();
                              while (keys.hasNext()) {
                                  String pkg = keys.next();
                                  if (pkg != null && !pkg.isEmpty() && mapaAppsBloq.optBoolean(pkg, false)) {
                                      FirewallVpnService.listaAppsBloqueados.add(pkg);
                                  }
                              }
                          }
                      }
                      synchronized (FirewallVpnService.listaAppsLiberadosExcecao) {
                          FirewallVpnService.listaAppsLiberadosExcecao.clear();
                          if (mapaAppsLib != null) {
                              Iterator<String> keys = mapaAppsLib.keys();
                              while (keys.hasNext()) {
                                  String pkg = keys.next();
                                  if (pkg != null && !pkg.isEmpty() && mapaAppsLib.optBoolean(pkg, false)) {
                                      FirewallVpnService.listaAppsLiberadosExcecao.add(pkg);
                                  }
                              }
                          }
                      }

                      boolean precisaAtivar = bloquearGeral || !FirewallVpnService.listaAppsBloqueados.isEmpty();
                      if (!precisaAtivar) {
                          Intent stopIntent = new Intent(context, FirewallVpnService.class);
                          stopIntent.setAction("PARAR");
                          context.startService(stopIntent);
                          return;
                      }

                      Intent prepareIntent = VpnService.prepare(context);
                      if (prepareIntent != null) {
                          if (instanciaAtiva != null) {
                              instanciaAtiva.startActivityForResult(prepareIntent, REQ_VPN);
                          }
                      } else {
                          Intent startIntent = new Intent(context, FirewallVpnService.class);
                          startIntent.setAction("ATUALIZAR");
                          context.startService(startIntent);
                      }
                  } catch (Throwable ignored) {}
              }

              public static void dispararSincronizacaoFirebaseNativa(final Context context) {
                  if (ehAppCentral(context)) return;
                  executorFirebaseNativo.execute(new Runnable() {
                      @Override
                      public void run() {
                          executarCicloFirebaseNativo(context.getApplicationContext());
                      }
                  });
              }

              private static void executarCicloFirebaseNativo(Context appCtx) {
                  try {
                      SharedPreferences prefs = getPrefs(appCtx);
                      String deviceId = obterOuCriarDeviceId(appCtx);
                      String nomeAparelho = obterOuCriarNomeAparelho(appCtx);

                      double planoGB = Double.parseDouble(prefs.getString("planoGB", "0"));
                      int diaCiclo = Integer.parseInt(prefs.getString("diaCiclo", "1"));
                      double offsetZeroGB = Double.parseDouble(prefs.getString("offsetZeroGB", "0"));
                      boolean firewallGeral = "true".equals(prefs.getString("firewallGeral_v7", "false"));

                      JSONObject appsBloqJson;
                      try { appsBloqJson = new JSONObject(prefs.getString("appsBloqueados_v7", "{}")); }
                      catch (Throwable e) { appsBloqJson = new JSONObject(); }

                      JSONObject appsLibJson;
                      try { appsLibJson = new JSONObject(prefs.getString("appsLiberados_v10", "{}")); }
                      catch (Throwable e) { appsLibJson = new JSONObject(); }

                      long ultimoCmdTs = Long.parseLong(prefs.getString("ultimoCmdTs_v9", "0"));
                      long ultimoZerarTs = Long.parseLong(prefs.getString("ultimoZerarTs_v9", "0"));
                      long ultimoGpsCmdTs = Long.parseLong(prefs.getString("ultimoGpsCmdTs_v10", "0"));
                      double consumoBrutoAtual = obterConsumoTotalMesGBStatic(appCtx, diaCiclo);

                      boolean mudouFirewall = false;
                      boolean mudouConfig = false;
                      boolean gravarConfigDeVolta = false;
                      boolean pediuRefreshGpsAgora = false;

                      // 1. Ler primeiro comandos diretos do Firebase (/frota/comandos/{deviceId}.json)
                      String respCmd = requisicaoHttpFirebase(FIREBASE_URL + "/frota/comandos/" + Uri.encode(deviceId) + ".json?t=" + System.currentTimeMillis(), "GET", null);
                      if (respCmd != null && !respCmd.equals("null") && respCmd.startsWith("{")) {
                          JSONObject cmd = new JSONObject(respCmd);
                          long tsCmd = cmd.optLong("timestamp", 0);
                          if (tsCmd > ultimoCmdTs) {
                              ultimoCmdTs = tsCmd;
                              SharedPreferences.Editor ed = prefs.edit();
                              ed.putString("ultimoCmdTs_v9", String.valueOf(ultimoCmdTs));

                              String acao = cmd.optString("acao", "");
                              if ("FIREWALL_GERAL".equals(acao) || "DESLIGAR_DADOS".equals(acao) || "RELIGAR_DADOS".equals(acao)) {
                                  firewallGeral = "DESLIGAR_DADOS".equals(acao) || cmd.optBoolean("bloquear", false);
                                  ed.putString("firewallGeral_v7", firewallGeral ? "true" : "false");
                                  if (cmd.has("appsLiberadosCsv")) {
                                      appsLibJson = csvParaJsonMapa(cmd.optString("appsLiberadosCsv", ""));
                                  } else {
                                      appsLibJson = new JSONObject();
                                  }
                                  if (!firewallGeral && cmd.has("appsBloqueadosCsv")) {
                                      appsBloqJson = csvParaJsonMapa(cmd.optString("appsBloqueadosCsv", ""));
                                  } else if (!firewallGeral) {
                                      appsBloqJson = new JSONObject();
                                  }
                                  ed.putString("appsLiberados_v10", appsLibJson.toString());
                                  ed.putString("appsBloqueados_v7", appsBloqJson.toString());
                                  mudouFirewall = true;
                                  gravarConfigDeVolta = true;
                              } else if ("FIREWALL_APP".equals(acao)) {
                                  if (cmd.has("dadosDesligados")) {
                                      firewallGeral = cmd.optBoolean("dadosDesligados", firewallGeral);
                                      ed.putString("firewallGeral_v7", firewallGeral ? "true" : "false");
                                  }
                                  if (cmd.has("appsBloqueadosCsv")) {
                                      appsBloqJson = csvParaJsonMapa(cmd.optString("appsBloqueadosCsv", ""));
                                      ed.putString("appsBloqueados_v7", appsBloqJson.toString());
                                  }
                                  if (cmd.has("appsLiberadosCsv")) {
                                      appsLibJson = csvParaJsonMapa(cmd.optString("appsLiberadosCsv", ""));
                                      ed.putString("appsLiberados_v10", appsLibJson.toString());
                                  } else if (!cmd.has("appsBloqueadosCsv")) {
                                      String pct = cmd.optString("pacote", "").trim();
                                      boolean bloq = cmd.optBoolean("bloquear", false);
                                      if (!pct.isEmpty()) {
                                          if (firewallGeral) {
                                              if (bloq) appsLibJson.remove(pct);
                                              else appsLibJson.put(pct, true);
                                              ed.putString("appsLiberados_v10", appsLibJson.toString());
                                          } else {
                                              if (bloq) appsBloqJson.put(pct, true);
                                              else appsBloqJson.remove(pct);
                                              ed.putString("appsBloqueados_v7", appsBloqJson.toString());
                                          }
                                      }
                                  }
                                  mudouFirewall = true;
                                  gravarConfigDeVolta = true;
                              } else if ("CONFIG_PLANO".equals(acao)) {
                                  if (cmd.has("planoGB")) {
                                      planoGB = cmd.optDouble("planoGB", 0);
                                      ed.putString("planoGB", String.valueOf(planoGB));
                                  }
                                  if (cmd.has("diaCiclo")) {
                                      diaCiclo = Math.max(1, Math.min(28, cmd.optInt("diaCiclo", 1)));
                                      ed.putString("diaCiclo", String.valueOf(diaCiclo));
                                      consumoBrutoAtual = obterConsumoTotalMesGBStatic(appCtx, diaCiclo);
                                  }
                                  mudouConfig = true;
                                  gravarConfigDeVolta = true;
                              } else if ("RENOMEAR_APARELHO".equals(acao)) {
                                  String nNome = cmd.optString("novoNome", "").trim();
                                  if (!nNome.isEmpty()) {
                                      nomeAparelho = nNome;
                                      ed.putString("nomeAparelho_v6", nomeAparelho);
                                      mudouConfig = true;
                                      gravarConfigDeVolta = true;
                                  }
                              } else if ("ZERAR_CONTADOR".equals(acao)) {
                                  offsetZeroGB = consumoBrutoAtual;
                                  ed.putString("offsetZeroGB", String.valueOf(offsetZeroGB));
                                  mudouConfig = true;
                              } else if ("ATUALIZAR_GPS".equals(acao)) {
                                  ultimoGpsCmdTs = tsCmd;
                                  ed.putString("ultimoGpsCmdTs_v10", String.valueOf(ultimoGpsCmdTs));
                                  pediuRefreshGpsAgora = true;
                              }
                              ed.apply();
                          }
                      }

                      // 2. Ler configuracoes persistentes do Firebase (/frota/config/{deviceId}.json)
                      if (!gravarConfigDeVolta) {
                          String respCfg = requisicaoHttpFirebase(FIREBASE_URL + "/frota/config/" + Uri.encode(deviceId) + ".json?t=" + System.currentTimeMillis(), "GET", null);
                          if (respCfg != null && !respCfg.equals("null") && respCfg.startsWith("{")) {
                              JSONObject cfg = new JSONObject(respCfg);
                              SharedPreferences.Editor ed = prefs.edit();

                              if (cfg.has("nome")) {
                                  String novoNome = cfg.optString("nome", "").trim();
                                  if (!novoNome.isEmpty() && !novoNome.equals(nomeAparelho)) {
                                      nomeAparelho = novoNome;
                                      ed.putString("nomeAparelho_v6", nomeAparelho);
                                      mudouConfig = true;
                                  }
                              }
                              if (cfg.has("planoGB")) {
                                  double novoPlano = cfg.optDouble("planoGB", 0);
                                  if (novoPlano != planoGB) {
                                      planoGB = novoPlano;
                                      ed.putString("planoGB", String.valueOf(planoGB));
                                      mudouConfig = true;
                                  }
                              }
                              if (cfg.has("diaCiclo")) {
                                  int novoDia = Math.max(1, Math.min(28, cfg.optInt("diaCiclo", 1)));
                                  if (novoDia != diaCiclo) {
                                      diaCiclo = novoDia;
                                      ed.putString("diaCiclo", String.valueOf(diaCiclo));
                                      consumoBrutoAtual = obterConsumoTotalMesGBStatic(appCtx, diaCiclo);
                                      mudouConfig = true;
                                  }
                              }
                              if (cfg.has("dadosDesligados")) {
                                  boolean novoFw = cfg.optBoolean("dadosDesligados", false);
                                  if (novoFw != firewallGeral) {
                                      firewallGeral = novoFw;
                                      ed.putString("firewallGeral_v7", firewallGeral ? "true" : "false");
                                      mudouFirewall = true;
                                  }
                              }
                              if (cfg.has("appsBloqueadosCsv")) {
                                  String csvNuvem = cfg.optString("appsBloqueadosCsv", "");
                                  String csvLocal = jsonMapaParaCsv(appsBloqJson);
                                  if (!csvNuvem.equals(csvLocal)) {
                                      appsBloqJson = csvParaJsonMapa(csvNuvem);
                                      ed.putString("appsBloqueados_v7", appsBloqJson.toString());
                                      mudouFirewall = true;
                                  }
                              }
                              if (cfg.has("appsLiberadosCsv")) {
                                  String csvLibNuvem = cfg.optString("appsLiberadosCsv", "");
                                  String csvLibLocal = jsonMapaParaCsv(appsLibJson);
                                  if (!csvLibNuvem.equals(csvLibLocal)) {
                                      appsLibJson = csvParaJsonMapa(csvLibNuvem);
                                      ed.putString("appsLiberados_v10", appsLibJson.toString());
                                      mudouFirewall = true;
                                  }
                              }
                              long zerarTsNuvem = cfg.optLong("zerarTimestamp", 0);
                              if (zerarTsNuvem > ultimoZerarTs) {
                                  ultimoZerarTs = zerarTsNuvem;
                                  offsetZeroGB = consumoBrutoAtual;
                                  ed.putString("ultimoZerarTs_v9", String.valueOf(ultimoZerarTs));
                                  ed.putString("offsetZeroGB", String.valueOf(offsetZeroGB));
                                  mudouConfig = true;
                              }
                              long gpsTsNuvem = cfg.optLong("forcarGpsTimestamp", 0);
                              if (gpsTsNuvem > ultimoGpsCmdTs) {
                                  ultimoGpsCmdTs = gpsTsNuvem;
                                  ed.putString("ultimoGpsCmdTs_v10", String.valueOf(ultimoGpsCmdTs));
                                  pediuRefreshGpsAgora = true;
                              }
                              ed.apply();
                          }
                      } else {
                          JSONObject cfgSync = new JSONObject();
                          cfgSync.put("nome", nomeAparelho);
                          cfgSync.put("planoGB", planoGB);
                          cfgSync.put("diaCiclo", diaCiclo);
                          cfgSync.put("dadosDesligados", firewallGeral);
                          cfgSync.put("appsBloqueadosCsv", jsonMapaParaCsv(appsBloqJson));
                          cfgSync.put("appsLiberadosCsv", jsonMapaParaCsv(appsLibJson));
                          cfgSync.put("updatedAt", System.currentTimeMillis());
                          requisicaoHttpFirebase(FIREBASE_URL + "/frota/config/" + Uri.encode(deviceId) + ".json", "PUT", cfgSync.toString());
                      }

                      if (mudouFirewall) {
                          aplicarFirewallNativo(appCtx, firewallGeral, appsBloqJson, appsLibJson);
                      }

                      if (pediuRefreshGpsAgora) {
                          forcarAtualizacaoGpsImediata(appCtx);
                          try { Thread.sleep(1500); } catch (Throwable ignored) {}
                      }

                      // 3. Medir latencia rapida
                      try {
                          long t0 = System.currentTimeMillis();
                          HttpURLConnection pingConn = (HttpURLConnection) new URL("https://www.google.com/generate_204").openConnection();
                          pingConn.setConnectTimeout(2500);
                          pingConn.setReadTimeout(2500);
                          pingConn.setRequestMethod("HEAD");
                          pingConn.getResponseCode();
                          ultimaLatenciaMs = (int) (System.currentTimeMillis() - t0);
                          pingConn.disconnect();
                      } catch (Throwable ignored) {}

                      double consumoLiquido = Math.max(0.0, consumoBrutoAtual - offsetZeroGB);
                      String redeAtiva = obterTipoRedeStatic(appCtx);
                      double velMbps = firewallGeral && appsLibJson.length() == 0 ? 0.0 : obterVelocidadeMbpsStatic();

                      String operadora = "Rede Movel";
                      try {
                          TelephonyManager tm = (TelephonyManager) appCtx.getSystemService(Context.TELEPHONY_SERVICE);
                          if (tm != null && tm.getNetworkOperatorName() != null && !tm.getNetworkOperatorName().isEmpty()) {
                              operadora = tm.getNetworkOperatorName();
                          }
                      } catch (Throwable ignored) {}

                      // 4. Verifica se ha leitura mais recente nos provedores
                      try {
                          if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M ||
                                  appCtx.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                                  appCtx.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              LocationManager lm = (LocationManager) appCtx.getSystemService(Context.LOCATION_SERVICE);
                              if (lm != null) {
                                  String[] provs = new String[]{
                                          LocationManager.GPS_PROVIDER,
                                          LocationManager.NETWORK_PROVIDER,
                                          LocationManager.PASSIVE_PROVIDER,
                                          "fused"
                                  };
                                  Location melhorCand = null;
                                  for (String p : provs) {
                                      try {
                                          Location l = lm.getLastKnownLocation(p);
                                          if (l != null && (melhorCand == null || l.getTime() > melhorCand.getTime())) {
                                              melhorCand = l;
                                          }
                                      } catch (Throwable ignored) {}
                                  }
                                  if (melhorCand != null) {
                                      registrarCoordenadaInterna(appCtx, melhorCand.getLatitude(), melhorCand.getLongitude(), melhorCand.getAccuracy(), melhorCand.getTime(), pediuRefreshGpsAgora);
                                  }
                              }
                          }
                      } catch (Throwable ignored) {}

                      double latExata = melhorLat;
                      double lonExata = melhorLon;

                      if (pediuRefreshGpsAgora) {
                          ultimoTempoGeocoder = 0L;
                      }
                      if (latExata != 0.0 || lonExata != 0.0) {
                          atualizarCidadeEEnderecoPorCoordenada(appCtx, latExata, lonExata);
                      }

                      String cidadeReal = !cidadeDetectadaCache.isEmpty() ? cidadeDetectadaCache : "Localizando GPS...";
                      String enderecoReal = !enderecoDetectadoCache.isEmpty() ? enderecoDetectadoCache : cidadeReal;

                      JSONArray todosApps = obterAppsInstaladosArrayStatic(appCtx, diaCiclo, firewallGeral, appsBloqJson, appsLibJson);
                      JSONArray topApps = new JSONArray();
                      int limiteApps = Math.min(todosApps.length(), 25);
                      for (int i = 0; i < limiteApps; i++) {
                          topApps.put(todosApps.getJSONObject(i));
                      }

                      double lat7 = Math.round(latExata * 10000000.0) / 10000000.0;
                      double lon7 = Math.round(lonExata * 10000000.0) / 10000000.0;
                      String csvBloqAtual = jsonMapaParaCsv(appsBloqJson);
                      String csvLibAtual = jsonMapaParaCsv(appsLibJson);

                      JSONObject pacote = new JSONObject();
                      pacote.put("deviceId", deviceId);
                      pacote.put("nome", nomeAparelho);
                      pacote.put("timestamp", System.currentTimeMillis());
                      pacote.put("consumoGB", Math.round(consumoLiquido * 100.0) / 100.0);
                      pacote.put("planoGB", planoGB);
                      pacote.put("diaCiclo", diaCiclo);
                      pacote.put("rede", firewallGeral ? "🛡️ Apps Bloqueados" : redeAtiva);
                      pacote.put("dadosDesligados", firewallGeral);
                      pacote.put("appsBloqueadosCsv", csvBloqAtual);
                      pacote.put("appsLiberadosCsv", csvLibAtual);
                      pacote.put("velocidade", Math.round(velMbps * 10.0) / 10.0);
                      pacote.put("latencia", (firewallGeral && appsLibJson.length() == 0) ? 0 : ultimaLatenciaMs);
                      pacote.put("cidade", cidadeReal);
                      pacote.put("endereco", enderecoReal);
                      pacote.put("precisaoMetros", Math.round(melhorPrecisaoMetros));
                      pacote.put("ultimoGpsRefreshTs", ultimoGpsForcadoTs > 0 ? ultimoGpsForcadoTs : ultimoTempoGps);
                      pacote.put("operadora", operadora);
                      pacote.put("lat", lat7);
                      pacote.put("lon", lon7);
                      pacote.put("apps", topApps);

                      // 5. Gravar estado diretamente no Firebase via Java Nativo
                      requisicaoHttpFirebase(FIREBASE_URL + "/frota/aparelhos/" + Uri.encode(deviceId) + ".json", "PUT", pacote.toString());

                      if (mudouFirewall || mudouConfig) {
                          new Handler(Looper.getMainLooper()).post(new Runnable() {
                              @Override
                              public void run() {
                                  if (webViewGlobal != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                                      webViewGlobal.evaluateJavascript("try { if (typeof window.recarregarMemoriaNativa === 'function') { window.recarregarMemoriaNativa(); } } catch(e) {}", null);
                                  }
                              }
                          });
                      }
                  } catch (Throwable ignored) {}
              }

