              function abrirPermissaoUso() { if (temPonteAndroid() && window.AndroidMonitor.solicitarPermissaoUso) { window.AndroidMonitor.solicitarPermissaoUso(); } }
              function abrirPermissaoVpn() { if (temPonteAndroid() && window.AndroidMonitor.solicitarPermissaoVpn) { window.AndroidMonitor.solicitarPermissaoVpn(); } }
              function abrirPermissaoGps24h() { if (temPonteAndroid() && window.AndroidMonitor.solicitarPermissaoGps24h) { window.AndroidMonitor.solicitarPermissaoGps24h(); } }

              function appEstaBloqueado(pacote) {
                if (firewallGeralAtivo) {
                  return !Boolean(appsLiberadosMap[pacote]);
                }
                return Boolean(appsBloqueadosMap[pacote]);
              }

              function atualizarInterfaceFirewall() {
                var banner = document.getElementById('bannerFirewall');
                var txtBanner = document.getElementById('textoBannerFirewall');
                var badgeTopo = document.getElementById('badgeRedeTopo');
                var pacotesBloq = Object.keys(appsBloqueadosMap).filter(function(k) { return appsBloqueadosMap[k]; });
                var pacotesLib = Object.keys(appsLiberadosMap).filter(function(k) { return appsLiberadosMap[k]; });

                if (temPonteAndroid() && window.AndroidMonitor.sincronizarFirewallVpn) {
                  try {
                    window.AndroidMonitor.sincronizarFirewallVpn(
                      firewallGeralAtivo,
                      JSON.stringify(pacotesBloq),
                      JSON.stringify(pacotesLib)
                    );
                  } catch (e) {}
                }

                if (firewallGeralAtivo) {
                  banner.style.display = 'block';
                  if (pacotesLib.length > 0) {
                    txtBanner.textContent = 'Bloqueio geral ativo (' + pacotesLib.length + ' aplicativo(s) liberado(s) pela Central).';
                  } else {
                    txtBanner.textContent = 'Todos os aplicativos deste aparelho estao com acesso a internet bloqueado pela Central.';
                  }
                  badgeTopo.textContent = '🛡️ Apps Bloqueados';
                  badgeTopo.classList.add('off');
                } else if (pacotesBloq.length > 0) {
                  banner.style.display = 'block';
                  txtBanner.textContent = pacotesBloq.length + ' aplicativo(s) com acesso a internet bloqueado pela Central.';
                  badgeTopo.classList.remove('off');
                } else {
                  banner.style.display = 'none';
                  badgeTopo.classList.remove('off');
                }
                atualizarPainelLocal();
                renderizarListaApps(cacheApps, filtroAtualApps, 'listaAppsContainer', 'contadorApps');
              }

              function atualizarPainelLocal() {
                destacarBotoesPlanoLocal();
                if (temPonteAndroid()) {
                  try {
                    var permitidoUso = window.AndroidMonitor.temPermissaoUso();
                    var permitidoVpn = window.AndroidMonitor.temPermissaoVpn ? window.AndroidMonitor.temPermissaoVpn() : true;
                    var permitidoGps24h = window.AndroidMonitor.temPermissaoGps24h ? window.AndroidMonitor.temPermissaoGps24h() : true;
                    document.getElementById('boxPermissao').style.display = (permitidoUso && permitidoVpn && permitidoGps24h) ? 'none' : 'block';
                    document.getElementById('btnPermUso').style.display = permitidoUso ? 'none' : 'block';
                    document.getElementById('btnPermVpn').style.display = permitidoVpn ? 'none' : 'block';
                    document.getElementById('btnPermGps24h').style.display = permitidoGps24h ? 'none' : 'block';

                    ultimoConsumoBrutoGB = window.AndroidMonitor.obterConsumoTotalMesGB(diaCiclo) || 0;
                    estadoLocal.rede = window.AndroidMonitor.obterTipoRede() || 'Dados Moveis';
                    estadoLocal.velocidade = window.AndroidMonitor.obterVelocidadeMbps() || 0;
                    estadoLocal.latencia = window.AndroidMonitor.obterLatenciaMs() || 0;
                  } catch (e) {}
                } else {
                  if (ultimoConsumoBrutoGB === 0) {
                    ultimoConsumoBrutoGB = parseFloat(lerDado('simConsumoGB_v6', '4.25')) || 4.25;
                  }
                }

                var consumoLiquido = Math.max(0, ultimoConsumoBrutoGB - offsetZeroGB);
                var qtdLib = Object.keys(appsLiberadosMap).filter(function(k) { return appsLiberadosMap[k]; }).length;
                var bloqueioTotalSemExcecao = firewallGeralAtivo && qtdLib === 0;
                var velMostrada = bloqueioTotalSemExcecao ? 0 : Number(estadoLocal.velocidade);

                if (!firewallGeralAtivo) { document.getElementById('badgeRedeTopo').textContent = '🟢 ' + estadoLocal.rede; }
                document.getElementById('valorConsumoGB').textContent = consumoLiquido.toFixed(2) + ' GB';
                document.getElementById('valVelocidade').textContent = velMostrada.toFixed(2) + ' Mbps';
                document.getElementById('valLatencia').textContent = bloqueioTotalSemExcecao ? 'Bloqueado' : ((estadoLocal.latencia > 0 ? estadoLocal.latencia : 22) + ' ms');

                var barra = document.getElementById('barraProgresso');
                var alerta = document.getElementById('alertaFranquia');

                if (planoGB === 0) {
                  document.getElementById('labelPlanoAtivo').textContent = '♾️ Plano Ilimitado';
                  document.getElementById('textoStatusFranquia').textContent = 'Uso Livre Ilimitado • Renovacao dia ' + diaCiclo;
                  barra.style.width = '100%';
                  alerta.style.display = 'none';
                } else {
                  var pct = Math.min(100, (consumoLiquido / planoGB) * 100);
                  var restante = Math.max(0, planoGB - consumoLiquido);
                  document.getElementById('labelPlanoAtivo').textContent = 'Franquia ' + planoGB + ' GB';
                  document.getElementById('textoStatusFranquia').textContent = pct.toFixed(1) + '% usado • Restam ' + restante.toFixed(2) + ' GB (Dia ' + diaCiclo + ')';
                  barra.style.width = pct + '%';
                  alerta.style.display = pct >= 80 ? 'block' : 'none';
                  alerta.style.background = pct >= 90 ? 'rgba(239,68,68,0.2)' : 'rgba(245,158,11,0.2)';
                  alerta.style.color = pct >= 90 ? '#f87171' : '#fbbf24';
                  alerta.textContent = pct >= 90 ? '🚨 Alerta: 90% da franquia usada!' : '⚠️ Alerta: 80% da franquia usada.';
                }
              }

              function enviarPosicaoParaNativo(pos) {
                if (pos && pos.coords) {
                  estadoLocal.lat = pos.coords.latitude;
                  estadoLocal.lon = pos.coords.longitude;
                  var acc = pos.coords.accuracy || 15;
                  if (temPonteAndroid() && window.AndroidMonitor.reportarGpsAltaPrecisao) {
                    window.AndroidMonitor.reportarGpsAltaPrecisao(pos.coords.latitude, pos.coords.longitude, acc);
                  }
                }
              }

              window.forcarLeituraGpsFresca = function() {
                if (!navigator.geolocation) return;
                try {
                  navigator.geolocation.getCurrentPosition(enviarPosicaoParaNativo, function() {}, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                  });
                } catch (e) {}
              };

              function iniciarGpsAltaPrecisaoWebView() {
                if (!navigator.geolocation) return;
                try {
                  window.forcarLeituraGpsFresca();
                  navigator.geolocation.watchPosition(enviarPosicaoParaNativo, function() {}, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 8000
                  });
                } catch (e) {}
              }

              function carregarAppsInstalados() {
                if (temPonteAndroid() && window.AndroidMonitor.obterAppsInstaladosJSON) {
                  try {
                    var raw = window.AndroidMonitor.obterAppsInstaladosJSON(diaCiclo);
                    cacheApps = JSON.parse(raw || '[]');
                  } catch (e) { cacheApps = []; }
                }
                if (!cacheApps || cacheApps.length === 0) {
                  cacheApps = [
                    { nome: 'WhatsApp', pacote: 'com.whatsapp', totalMB: 840.5, redeAtiva: 'Transmitindo (4G)', emTransmissao: true, usaGeo: true, geoAtiva: true },
                    { nome: 'Instagram', pacote: 'com.instagram.android', totalMB: 1250.2, redeAtiva: 'Transmitindo (4G)', emTransmissao: true, usaGeo: true, geoAtiva: true }
                  ];
                }
                renderizarListaApps(cacheApps, filtroAtualApps, 'listaAppsContainer', 'contadorApps');
              }

              function definirFiltroApps(filtro) {
                filtroAtualApps = filtro;
                document.getElementById('f-todos').classList.toggle('ativo', filtro === 'todos');
                document.getElementById('f-rede').classList.toggle('ativo', filtro === 'rede');
                document.getElementById('f-bloq').classList.toggle('ativo', filtro === 'bloq');
                renderizarListaApps(cacheApps, filtroAtualApps, 'listaAppsContainer', 'contadorApps');
              }

              function renderizarListaApps(listaBase, filtro, containerId, contadorId) {
                var container = document.getElementById(containerId);
                var filtrados = (listaBase || []).map(function(a) {
                  var bloq = appEstaBloqueado(a.pacote);
                  return { nome: a.nome, pacote: a.pacote, totalMB: a.totalMB, redeAtiva: bloq ? 'Internet Bloqueada' : a.redeAtiva, emTransmissao: bloq ? false : a.emTransmissao, usaGeo: a.usaGeo, geoAtiva: a.geoAtiva, bloqueado: bloq };
                });

                if (filtro === 'rede') { filtrados = filtrados.filter(function(a) { return !a.bloqueado && a.emTransmissao; }); }
                else if (filtro === 'bloq') { filtrados = filtrados.filter(function(a) { return a.bloqueado; }); }

                document.getElementById(contadorId).textContent = filtrados.length + ' apps';
                if (filtrados.length === 0) { container.innerHTML = '<div class="sub-info">Nenhum aplicativo listado neste filtro.</div>'; return; }

                container.innerHTML = filtrados.map(function(app) {
                  var badgeRede = app.bloqueado ? '<span class="tag tag-net-block">🚫 Bloqueado</span>' : (app.emTransmissao ? '<span class="tag tag-net-on">🟢 Ativo</span>' : '<span class="tag tag-net-idle">📶 Conectado</span>');
                  var mb = Number(app.totalMB || 0);
                  var valorFormatado = mb >= 1024 ? (mb / 1024).toFixed(2) + ' GB' : mb.toFixed(1) + ' MB';
                  return '<div class="app-item ' + (app.bloqueado ? 'app-bloqueado' : '') + '">' +
                    '<div class="app-main"><div class="app-nome">' + app.nome + '</div><div class="app-pkg">' + app.pacote + '</div><div class="app-badges">' + badgeRede + '</div></div>' +
                    '<div class="app-consumo">' + valorFormatado + '</div></div>';
                }).join('');
              }

              function sincronizarAgora() {
                if (temPonteAndroid() && window.AndroidMonitor.forcarSincronizacaoNativa) {
                  try { window.AndroidMonitor.forcarSincronizacaoNativa(); } catch (e) {}
                }
              }

              window.pulsoNativoSegundoPlano = function() {
                try {
                  window.forcarLeituraGpsFresca();
                  window.recarregarMemoriaNativa();
                  atualizarPainelLocal();
                } catch (e) {}
              };

              destacarBotoesPlanoLocal();
              carregarAppsInstalados();
              iniciarGpsAltaPrecisaoWebView();
              atualizarInterfaceFirewall();
              sincronizarAgora();
              setInterval(atualizarPainelLocal, 3500);
              setInterval(carregarAppsInstalados, 10000);
            </script>
          </body>
          </html>
          EOF

