                  @JavascriptInterface
                  public void abrirMapaNativo(double lat, double lon, String rotulo) {
                      String coordExata = String.format(Locale.US, "%.7f,%.7f", lat, lon);
                      try {
                          String labelLimpo = (rotulo != null && !rotulo.isEmpty()) ? Uri.encode(rotulo) : "Aparelho";
                          Uri geoUri = Uri.parse("geo:0,0?q=" + coordExata + "(" + labelLimpo + ")&z=19");
                          Intent mapIntent = new Intent(Intent.ACTION_VIEW, geoUri);
                          mapIntent.setPackage("com.google.android.apps.maps");
                          mapIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          if (mapIntent.resolveActivity(context.getPackageManager()) != null) {
                              context.startActivity(mapIntent);
                              return;
                          }
                      } catch (Throwable ignored) {}

                      try {
                          Uri webUri = Uri.parse("https://www.google.com/maps/search/?api=1&query=" + coordExata);
                          Intent webIntent = new Intent(Intent.ACTION_VIEW, webUri);
                          webIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          context.startActivity(webIntent);
                      } catch (Throwable ignored) {}
                  }

