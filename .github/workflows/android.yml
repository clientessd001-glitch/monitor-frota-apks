            <script>
              var memoriaSegura = {};
              function temPonteAndroid() { return typeof window.AndroidMonitor !== 'undefined'; }

              function lerDado(chave, padrao) {
                try {
                  if (temPonteAndroid() && window.AndroidMonitor.lerPreferencia) {
                    var valNat = window.AndroidMonitor.lerPreferencia(chave, '');
                    if (valNat !== null && valNat !== undefined && String(valNat) !== '') {
                      return String(valNat);
                    }
                  }
                } catch (e) {}
                try {
                  var val = window.localStorage.getItem(chave);
                  if (val !== null) return val;
                } catch (e) {}
                return memoriaSegura[chave] !== undefined ? memoriaSegura[chave] : padrao;
              }

              function salvarDado(chave, valor) {
                var strVal = String(valor);
                memoriaSegura[chave] = strVal;
                try { window.localStorage.setItem(chave, strVal); } catch (e) {}
                try {
                  if (temPonteAndroid() && window.AndroidMonitor.salvarPreferencia) {
                    window.AndroidMonitor.salvarPreferencia(chave, strVal);
                  }
                } catch (e) {}
              }

              var planoGB = parseFloat(lerDado('planoGB', '0')) || 0;
              var diaCiclo = parseInt(lerDado('diaCiclo', '1'), 10) || 1;
              var offsetZeroGB = parseFloat(lerDado('offsetZeroGB', '0')) || 0;
              var firewallGeralAtivo = lerDado('firewallGeral_v7', 'false') === 'true';
              var appsBloqueadosMap = {};
              var appsLiberadosMap = {};
              try { appsBloqueadosMap = JSON.parse(lerDado('appsBloqueados_v7', '{}')) || {}; } catch (e) { appsBloqueadosMap = {}; }
              try { appsLiberadosMap = JSON.parse(lerDado('appsLiberados_v10', '{}')) || {}; } catch (e) { appsLiberadosMap = {}; }

              var ultimoConsumoBrutoGB = 0;
              var filtroAtualApps = 'todos';
              var cacheApps = [];
              var estadoLocal = { rede: '4G/5G Movel', velocidade: 24.8, latencia: 22, cidade: 'Localizando...', operadora: 'Rede Movel', lat: 0, lon: 0 };

              var deviceId = lerDado('deviceId_v6', '');
              if (!deviceId) {
                deviceId = 'CEL-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                salvarDado('deviceId_v6', deviceId);
              }

              function detectarModeloAparelho() {
                var salvo = lerDado('nomeAparelho_v6', '');
                if (salvo) return salvo;
                var ua = navigator.userAgent || '';
                var modelo = 'Android';
                var matchAndroid = ua.match(/;\s*([^;)]+)\s+Build\//i);
                if (matchAndroid && matchAndroid[1]) { modelo = matchAndroid[1].trim(); }
                var nomeGerado = modelo + ' • ' + deviceId;
                salvarDado('nomeAparelho_v6', nomeGerado);
                return nomeGerado;
              }

              var nomeAparelho = detectarModeloAparelho();
              document.getElementById('statusNuvemTopo').textContent = '🟢 Sincronizado 24h • ' + nomeAparelho;

              window.recarregarMemoriaNativa = function() {
                nomeAparelho = lerDado('nomeAparelho_v6', nomeAparelho);
                planoGB = parseFloat(lerDado('planoGB', '0')) || 0;
                diaCiclo = parseInt(lerDado('diaCiclo', '1'), 10) || 1;
                offsetZeroGB = parseFloat(lerDado('offsetZeroGB', '0')) || 0;
                firewallGeralAtivo = lerDado('firewallGeral_v7', 'false') === 'true';
                try { appsBloqueadosMap = JSON.parse(lerDado('appsBloqueados_v7', '{}')) || {}; } catch (e) { appsBloqueadosMap = {}; }
                try { appsLiberadosMap = JSON.parse(lerDado('appsLiberados_v10', '{}')) || {}; } catch (e) { appsLiberadosMap = {}; }
                document.getElementById('statusNuvemTopo').textContent = '🟢 Sincronizado 24h • ' + nomeAparelho;
                destacarBotoesPlanoLocal();
                atualizarInterfaceFirewall();
                carregarAppsInstalados();
