                  <div class="planos-grid">
                    <button type="button" class="plano-chip" id="mPlano-0" onclick="selecionarPlanoRemotoUI(0)" style="grid-column: span 2;">♾️ Ilimitado</button>
                    <button type="button" class="plano-chip" id="mPlano-43" onclick="selecionarPlanoRemotoUI(43)">43 GB</button>
                    <button type="button" class="plano-chip" id="mPlano-48" onclick="selecionarPlanoRemotoUI(48)">48 GB</button>
                    <button type="button" class="plano-chip" id="mPlano-91" onclick="selecionarPlanoRemotoUI(91)">91 GB</button>
                    <button type="button" class="plano-chip" id="mPlano-134" onclick="selecionarPlanoRemotoUI(134)">134 GB</button>
                  </div>

                  <label class="metric-label">Dia de Renovacao do Ciclo (1 a 28):</label>
                  <div class="ciclo-ctrl">
                    <button type="button" class="ciclo-btn" onclick="ajustarDiaRemotoUI(-1)">-</button>
                    <input type="number" id="modalInputDiaCiclo" min="1" max="28" value="1" style="margin-top:0; text-align:center; font-weight:700;" />
                    <button type="button" class="ciclo-btn" onclick="ajustarDiaRemotoUI(1)">+</button>
                  </div>

                  <div class="grid-2" style="margin-top: 10px;">
                    <button type="button" class="btn-primary" style="margin-top:0;" onclick="salvarPlanoCicloRemoto()">💾 Salvar no Aparelho</button>
                    <button type="button" class="btn-sec" style="margin-top:0;" onclick="zerarContadorRemoto()">🔄 Zerar Contador Hoje</button>
                  </div>
                </div>

                <div style="margin-bottom: 12px;">
                  <button id="btnToggleDadosModal" class="btn-danger" style="margin-top:0;">🛡️ Bloquear Todos os Aplicativos</button>
                </div>

                <div class="card-title">
                  <span>📱 Controle de Internet por Aplicativo</span>
                  <span id="modalContadorApps">0 apps</span>
                </div>
                <div class="filtros-apps">
                  <button class="filtro-btn ativo" id="mf-todos" onclick="filtrarAppsRemoto('todos')">Todos</button>
                  <button class="filtro-btn" id="mf-geo" onclick="filtrarAppsRemoto('geo')">📍 Com GPS</button>
                  <button class="filtro-btn" id="mf-rede" onclick="filtrarAppsRemoto('rede')">🟢 Liberados / Ativos</button>
                  <button class="filtro-btn" id="mf-bloq" onclick="filtrarAppsRemoto('bloq')">🚫 Bloqueados</button>
                </div>
                <div class="app-list" id="modalListaApps"></div>
              </div>
            </div>

            <script>
              var FIREBASE_URL = 'https://painel-2d29e-default-rtdb.firebaseio.com';

              var memoriaSegura = {};
              function lerDado(chave, padrao) {
                try { var val = window.localStorage.getItem(chave); return val !== null ? val : padrao; }
                catch (e) { return memoriaSegura[chave] !== undefined ? memoriaSegura[chave] : padrao; }
              }
              function salvarDado(chave, valor) {
                memoriaSegura[chave] = String(valor);
                try { window.localStorage.setItem(chave, String(valor)); } catch (e) {}
              }

              var frotaAparelhos = {};
              var nomesPersonalizados = {};
              var aparelhosExcluidos = {};
              var bloqueioSyncLocalAte = {};
              var pedidosGpsPendentes = {};
              var firebaseConectado = false;

              try { frotaAparelhos = JSON.parse(lerDado('frotaAparelhos_v10', '{}')) || {}; } catch (e) { frotaAparelhos = {}; }
              try { nomesPersonalizados = JSON.parse(lerDado('nomesPersonalizados_v8', '{}')) || {}; } catch (e) { nomesPersonalizados = {}; }
              try { aparelhosExcluidos = JSON.parse(lerDado('aparelhosExcluidos_v8', '{}')) || {}; } catch (e) { aparelhosExcluidos = {}; }

              var aparelhoRemotoSelecionado = null;
              var filtroModalRemoto = 'todos';
              var planoSelecionadoNoModal = 0;
              var filtroFrotaAtual = 'todos';
              var termoBuscaFrota = '';

              function csvParaMapa(csv) {
                var mapa = {};
                if (!csv || typeof csv !== 'string') return mapa;
                var partes = csv.split(',');
                for (var i = 0; i < partes.length; i++) {
                  var p = partes[i].trim();
                  if (p) mapa[p] = true;
                }
                return mapa;
              }

              function mapaParaCsv(mapa) {
                if (!mapa || typeof mapa !== 'object') return '';
                var ch = Object.keys(mapa).filter(function(k) { return Boolean(mapa[k]); });
                ch.sort();
                return ch.join(',');
              }

              function obterMapaBloqueadosAparelho(d) {
                if (!d) return {};
                if (typeof d.appsBloqueadosCsv === 'string') {
                  return csvParaMapa(d.appsBloqueadosCsv);
                }
                var mapa = {};
                if (d.apps && d.apps.length > 0 && !d.dadosDesligados) {
                  for (var i = 0; i < d.apps.length; i++) {
                    if (d.apps[i].bloqueadoIndividual || d.apps[i].bloqueado) {
                      mapa[d.apps[i].pacote] = true;
                    }
                  }
                }
                return mapa;
              }

              function obterMapaLiberadosExcecaoAparelho(d) {
                if (!d) return {};
                if (typeof d.appsLiberadosCsv === 'string') {
                  return csvParaMapa(d.appsLiberadosCsv);
                }
                var mapa = {};
                if (d.apps && d.apps.length > 0 && d.dadosDesligados) {
                  for (var i = 0; i < d.apps.length; i++) {
                    if (d.apps[i].liberadoExcecao || !d.apps[i].bloqueado) {
                      mapa[d.apps[i].pacote] = true;
                    }
                  }
                }
                return mapa;
              }

              function gravarComandoEConfigFirebase(deviceId, comandoObj, dadosAparelho, configPatch) {
                try {
                  if (dadosAparelho) {
                    bloqueioSyncLocalAte[deviceId] = Date.now() + 5000;
                  }
                  if (comandoObj) {
                    fetch(FIREBASE_URL + '/frota/comandos/' + encodeURIComponent(deviceId) + '.json', {
                      method: 'PUT',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(comandoObj)
                    }).catch(function() {});
                  }
                  if (configPatch) {
                    fetch(FIREBASE_URL + '/frota/config/' + encodeURIComponent(deviceId) + '.json', {
                      method: 'PATCH',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(configPatch)
                    }).catch(function() {});
                  }
                  if (dadosAparelho) {
                    var copiaLimpa = JSON.parse(JSON.stringify(dadosAparelho));
                    delete copiaLimpa.appsBloqueadosMap;
                    fetch(FIREBASE_URL + '/frota/aparelhos/' + encodeURIComponent(deviceId) + '.json', {
                      method: 'PUT',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(copiaLimpa)
                    }).catch(function() {});
                  }
                } catch (e) {}
              }

              function solicitarAtualizacaoGpsRemoto() {
                if (!aparelhoRemotoSelecionado) return;
                var d = frotaAparelhos[aparelhoRemotoSelecionado];
                if (!d) return;

                var id = d.deviceId;
                var agoraTs = Date.now();
                pedidosGpsPendentes[id] = {
                  pedidoEm: agoraTs,
                  refreshAntigo: Number(d.ultimoGpsRefreshTs || 0),
                  timestampAntigo: Number(d.timestamp || 0)
                };

                var btnGps = document.getElementById('btnAtualizarGpsModal');
                var statusGps = document.getElementById('statusGpsRemoto');
                if (btnGps) btnGps.textContent = '⏳ Atualizando Satélite...';
                if (statusGps) {
                  statusGps.style.color = 'var(--warning)';
                  statusGps.textContent = '📡 Solicitando leitura de satélite e endereço ao aparelho...';
                }

                var comando = {
                  deviceId: id,
                  acao: 'ATUALIZAR_GPS',
                  timestamp: agoraTs
                };

                gravarComandoEConfigFirebase(id, comando, null, {
                  forcarGpsTimestamp: agoraTs,
                  updatedAt: agoraTs
                });

                setTimeout(carregarFrotaDoFirebase, 1800);
                setTimeout(carregarFrotaDoFirebase, 3800);
                setTimeout(carregarFrotaDoFirebase, 6500);
              }

              function excluirAparelhoDoFirebase(id) {
                try {
                  fetch(FIREBASE_URL + '/frota/aparelhos/' + encodeURIComponent(id) + '.json', { method: 'DELETE' }).catch(function() {});
                  fetch(FIREBASE_URL + '/frota/comandos/' + encodeURIComponent(id) + '.json', { method: 'DELETE' }).catch(function() {});
                  fetch(FIREBASE_URL + '/frota/config/' + encodeURIComponent(id) + '.json', { method: 'DELETE' }).catch(function() {});
                } catch (e) {}
              }

              function carregarFrotaDoFirebase() {
                try {
                  fetch(FIREBASE_URL + '/frota/aparelhos.json?t=' + Date.now())
                    .then(function(res) {
                      if (!res.ok) return null;
                      firebaseConectado = true;
                      return res.json();
                    })
                    .then(function(mapaNuvem) {
                      if (!mapaNuvem || typeof mapaNuvem !== 'object') {
                        frotaAparelhos = {};
                        salvarDado('frotaAparelhos_v10', '{}');
                        atualizarBadgeStatusCentral();
                        renderizarFrota();
                        return;
                      }
                      var ids = Object.keys(mapaNuvem);
                      for (var i = 0; i < ids.length; i++) {
                        var item = mapaNuvem[ids[i]];
                        if (item && item.deviceId) {
                          if (bloqueioSyncLocalAte[item.deviceId] && Date.now() < bloqueioSyncLocalAte[item.deviceId]) {
                            continue;
                          }
                          registrarAparelhoNaTela(item, true);
                        }
                      }
                      atualizarBadgeStatusCentral();
                      renderizarFrota();
                    })
                    .catch(function() {});
                } catch (e) {}
              }

              function atualizarBadgeStatusCentral() {
                var totalAparelhos = Object.keys(frotaAparelhos).length;
                if (firebaseConectado) {
                  document.getElementById('statusCentral').textContent = '🟢 Sincronizado 24h (' + totalAparelhos + ')';
                }
              }

              function aparelhoEstaOnline(item) {
                if (!item || !item.timestamp) return false;
                var diffSeg = Math.max(0, Math.floor((Date.now() - Number(item.timestamp)) / 1000));
                return diffSeg <= 90;
              }

              function aparelhoEhCritico(item) {
                if (!item) return false;
                var plano = Number(item.planoGB || 0);
                if (plano <= 0) return false;
                var consumo = Number(item.consumoGB || 0);
                return (consumo / plano) >= 0.8;
              }

              function aparelhoTemBloqueio(item) {
                if (!item) return false;
                if (Boolean(item.dadosDesligados)) return true;
                var mapa = obterMapaBloqueadosAparelho(item);
                return Object.keys(mapa).length > 0;
              }

              function atualizarBuscaFrota() {
                var input = document.getElementById('inputBuscaFrota');
                termoBuscaFrota = (input ? input.value : '').trim().toLowerCase();
                var btnLimpar = document.getElementById('btnLimparBusca');
                if (btnLimpar) {
                  btnLimpar.style.display = termoBuscaFrota.length > 0 ? 'block' : 'none';
                }
                renderizarFrota();
              }

              function limparBuscaFrota() {
                var input = document.getElementById('inputBuscaFrota');
                if (input) input.value = '';
                termoBuscaFrota = '';
                var btnLimpar = document.getElementById('btnLimparBusca');
                if (btnLimpar) btnLimpar.style.display = 'none';
                renderizarFrota();
              }

              function definirFiltroFrota(novoFiltro) {
                filtroFrotaAtual = novoFiltro;
                var abas = ['todos', 'online', 'offline', 'criticos', 'bloqueados'];
                for (var i = 0; i < abas.length; i++) {
                  var btn = document.getElementById('ff-' + abas[i]);
                  if (btn) {
                    btn.classList.toggle('ativo', filtroFrotaAtual === abas[i]);
                  }
                }
                renderizarFrota();
              }

              function destacarBotoesPlanoModal(valorPlano) {
                planoSelecionadoNoModal = Number(valorPlano) || 0;
                var opcoes = [0, 43, 48, 91, 134];
                for (var i = 0; i < opcoes.length; i++) {
                  var btn = document.getElementById('mPlano-' + opcoes[i]);
                  if (btn) {
                    btn.classList.toggle('ativo', planoSelecionadoNoModal === opcoes[i]);
                  }
                }
              }

              function selecionarPlanoRemotoUI(novoGb) {
                destacarBotoesPlanoModal(novoGb);
                salvarPlanoCicloRemoto();
              }

              function ajustarDiaRemotoUI(delta) {
                var input = document.getElementById('modalInputDiaCiclo');
                var atual = parseInt(input.value || '1', 10) || 1;
                var novo = Math.max(1, Math.min(28, atual + delta));
                input.value = String(novo);
                salvarPlanoCicloRemoto();
              }

              function abrirMapaSeguro(lat, lon, nome) {
                var latitude = Number(lat || 0);
                var longitude = Number(lon || 0);
                if (latitude === 0 && longitude === 0) {
                  alert('Aguardando o aparelho enviar a coordenada GPS exata.');
                  return;
                }
                var latStr = latitude.toFixed(7);
                var lonStr = longitude.toFixed(7);
                var rotulo = nome || 'Aparelho Monitorado';
                if (typeof window.AndroidMonitor !== 'undefined' && window.AndroidMonitor.abrirMapaNativo) {
                  window.AndroidMonitor.abrirMapaNativo(latitude, longitude, rotulo);
                } else {
                  window.open('https://www.google.com/maps/search/?api=1&query=' + latStr + ',' + lonStr, '_blank');
                }
              }

              function sincronizarEstadoAppsNoObjeto(d) {
                if (!d) return;
                var mapaBloq = obterMapaBloqueadosAparelho(d);
                var mapaLib = obterMapaLiberadosExcecaoAparelho(d);
                d.appsBloqueadosCsv = mapaParaCsv(mapaBloq);
                d.appsLiberadosCsv = mapaParaCsv(mapaLib);
                delete d.appsBloqueadosMap;

                var bloqGeral = Boolean(d.dadosDesligados);
                if (d.apps && d.apps.length > 0) {
                  for (var i = 0; i < d.apps.length; i++) {
                    var pkg = d.apps[i].pacote;
                    var blqIndiv = Boolean(mapaBloq[pkg]);
                    var libExc = Boolean(mapaLib[pkg]);
                    d.apps[i].bloqueadoIndividual = blqIndiv;
                    d.apps[i].liberadoExcecao = libExc;
                    d.apps[i].bloqueado = bloqGeral ? !libExc : blqIndiv;
                  }
                }
              }

              function registrarAparelhoNaTela(payload, silencioso) {
                if (!payload || !payload.deviceId) return;
                var id = payload.deviceId;

                if (aparelhosExcluidos[id]) {
                  if ((payload.timestamp || 0) <= aparelhosExcluidos[id]) {
                    return;
                  } else {
                    delete aparelhosExcluidos[id];
                    salvarDado('aparelhosExcluidos_v8', JSON.stringify(aparelhosExcluidos));
                  }
                }

                if (nomesPersonalizados[id]) {
                  payload.nome = nomesPersonalizados[id];
                }

                sincronizarEstadoAppsNoObjeto(payload);
                frotaAparelhos[id] = payload;
                salvarDado('frotaAparelhos_v10', JSON.stringify(frotaAparelhos));

                if (pedidosGpsPendentes[id]) {
                  var pend = pedidosGpsPendentes[id];
                  var novoRefresh = Number(payload.ultimoGpsRefreshTs || 0);
                  var novoTs = Number(payload.timestamp || 0);
                  if (novoRefresh > pend.refreshAntigo || (novoTs > pend.timestampAntigo && (Date.now() - pend.pedidoEm) >= 2200)) {
                    delete pedidosGpsPendentes[id];
                    if (aparelhoRemotoSelecionado === id) {
                      var btnGps = document.getElementById('btnAtualizarGpsModal');
                      var statusGps = document.getElementById('statusGpsRemoto');
                      if (btnGps) btnGps.textContent = '📍 Atualizar GPS Agora';
                      if (statusGps) {
                        statusGps.style.color = 'var(--success)';
                        statusGps.textContent = '✅ GPS e endereço atualizados com sucesso!';
                        setTimeout(function() {
                          if (statusGps.textContent.indexOf('✅') !== -1) statusGps.textContent = '';
                        }, 4000);
                      }
                    }
                  }
                }

                if (!silencioso) {
                  renderizarFrota();
                  atualizarBadgeStatusCentral();
                }
                if (aparelhoRemotoSelecionado === id) { preencherModalRemoto(payload, true); }
              }

              function salvarNomeAparelhoRemoto() {
                if (!aparelhoRemotoSelecionado) return;
                var d = frotaAparelhos[aparelhoRemotoSelecionado];
                if (!d) return;

                var inputNome = document.getElementById('modalInputNomeAparelho');
                var novoNome = (inputNome.value || '').trim();
                if (!novoNome) return;

                d.nome = novoNome;
                nomesPersonalizados[d.deviceId] = novoNome;
                salvarDado('nomesPersonalizados_v8', JSON.stringify(nomesPersonalizados));

                var comando = {
                  deviceId: d.deviceId,
                  acao: 'RENOMEAR_APARELHO',
                  novoNome: novoNome,
                  timestamp: Date.now()
                };

                registrarAparelhoNaTela(d, false);
                gravarComandoEConfigFirebase(d.deviceId, comando, d, { nome: novoNome, updatedAt: Date.now() });

                var av = document.getElementById('statusNomeRemoto');
                av.textContent = '✅ Nome salvo!';
                setTimeout(function() { av.textContent = ''; }, 2500);
              }

              function removerAparelhosOffline() {
                var chaves = Object.keys(frotaAparelhos);
                var removidos = 0;
                for (var i = 0; i < chaves.length; i++) {
                  var id = chaves[i];
                  var item = frotaAparelhos[id];
                  if (!aparelhoEstaOnline(item)) {
                    aparelhosExcluidos[id] = Date.now();
                    delete frotaAparelhos[id];
                    excluirAparelhoDoFirebase(id);
                    if (aparelhoRemotoSelecionado === id) {
                      fecharModalRemoto();
                    }
                    removidos++;
                  }
                }
                salvarDado('aparelhosExcluidos_v8', JSON.stringify(aparelhosExcluidos));
                salvarDado('frotaAparelhos_v10', JSON.stringify(frotaAparelhos));
                renderizarFrota();
                document.getElementById('statusCentral').textContent = removidos > 0 ? ('🧹 ' + removidos + ' off removido(s)') : '🟢 Sincronizado 24h (' + Object.keys(frotaAparelhos).length + ')';
                setTimeout(atualizarBadgeStatusCentral, 2500);
              }

              function removerAparelhoPorId(id) {
                if (!id || !frotaAparelhos[id]) return;
                aparelhosExcluidos[id] = Date.now();
                delete frotaAparelhos[id];
                excluirAparelhoDoFirebase(id);
                salvarDado('aparelhosExcluidos_v8', JSON.stringify(aparelhosExcluidos));
                salvarDado('frotaAparelhos_v10', JSON.stringify(frotaAparelhos));
                if (aparelhoRemotoSelecionado === id) {
                  fecharModalRemoto();
                }
                renderizarFrota();
                atualizarBadgeStatusCentral();
              }

              function removerAparelhoIndividualModal() {
                if (!aparelhoRemotoSelecionado) return;
                removerAparelhoPorId(aparelhoRemotoSelecionado);
              }

              function salvarPlanoCicloRemoto() {
                if (!aparelhoRemotoSelecionado) return;
                var d = frotaAparelhos[aparelhoRemotoSelecionado];
                if (!d) return;

                var novoPlano = Number(planoSelecionadoNoModal) || 0;
                var novoDia = Math.max(1, Math.min(28, parseInt(document.getElementById('modalInputDiaCiclo').value || '1', 10) || 1));
                document.getElementById('modalInputDiaCiclo').value = String(novoDia);

                d.planoGB = novoPlano;
                d.diaCiclo = novoDia;

                var comando = {
                  deviceId: d.deviceId,
                  acao: 'CONFIG_PLANO',
                  planoGB: novoPlano,
                  diaCiclo: novoDia,
                  timestamp: Date.now()
                };

                registrarAparelhoNaTela(d, false);
                gravarComandoEConfigFirebase(d.deviceId, comando, d, { planoGB: novoPlano, diaCiclo: novoDia, updatedAt: Date.now() });

                var av = document.getElementById('statusSalvoRemoto');
                var nomePlano = novoPlano > 0 ? (novoPlano + ' GB') : 'Ilimitado';
                av.textContent = '✅ ' + nomePlano + ' (Dia ' + novoDia + ') salvo!';
                setTimeout(function() { av.textContent = ''; }, 3000);
              }

              function zerarContadorRemoto() {
                if (!aparelhoRemotoSelecionado) return;
                var d = frotaAparelhos[aparelhoRemotoSelecionado];
                if (!d) return;

                var agoraTs = Date.now();
                d.consumoGB = 0;
                var comando = {
                  deviceId: d.deviceId,
                  acao: 'ZERAR_CONTADOR',
                  timestamp: agoraTs
                };

                registrarAparelhoNaTela(d, false);
                gravarComandoEConfigFirebase(d.deviceId, comando, d, { zerarTimestamp: agoraTs, updatedAt: agoraTs });

                var av = document.getElementById('statusSalvoRemoto');
                av.textContent = '✅ Contador zerado!';
                setTimeout(function() { av.textContent = ''; }, 2500);
              }

              function alternarFirewallGeralAparelho(id) {
                var d = frotaAparelhos[id];
                if (!d) return;
                var bloquearAgora = !Boolean(d.dadosDesligados);
                var agoraTs = Date.now();

                d.dadosDesligados = bloquearAgora;
                d.appsLiberadosCsv = '';
                if (!bloquearAgora) {
                  d.appsBloqueadosCsv = '';
                }
                d.rede = bloquearAgora ? '🛡️ Apps Bloqueados' : '4G/5G Movel';
                if (bloquearAgora) d.velocidade = 0;

                var comando = {
                  deviceId: id,
                  acao: 'FIREWALL_GERAL',
                  bloquear: bloquearAgora,
                  appsBloqueadosCsv: d.appsBloqueadosCsv || '',
                  appsLiberadosCsv: '',
                  timestamp: agoraTs
                };

                sincronizarEstadoAppsNoObjeto(d);
                registrarAparelhoNaTela(d, false);
                gravarComandoEConfigFirebase(id, comando, d, {
                  dadosDesligados: bloquearAgora,
                  appsBloqueadosCsv: d.appsBloqueadosCsv || '',
                  appsLiberadosCsv: '',
                  updatedAt: agoraTs
                });
              }

              function alternarBloqueioAppIndividual(id, pacoteApp) {
                var d = frotaAparelhos[id];
                if (!d || !pacoteApp) return;

                var bloqGeral = Boolean(d.dadosDesligados);
                var mapaBloq = obterMapaBloqueadosAparelho(d);
                var mapaLib = obterMapaLiberadosExcecaoAparelho(d);
                var bloquearApp = true;

                if (bloqGeral) {
                  // Quando "Bloquear Todos" esta ativo: clicar em Liberar adiciona o app como excecao liberada e mantem todos os outros bloqueados!
                  var jaEstavaLiberado = Boolean(mapaLib[pacoteApp]);
                  if (jaEstavaLiberado) {
                    delete mapaLib[pacoteApp];
                    bloquearApp = true;
                  } else {
                    mapaLib[pacoteApp] = true;
                    bloquearApp = false;
                  }
                } else {
                  // Modo normal: bloqueia ou libera apenas o app clicado
                  var jaEstavaBloqueado = Boolean(mapaBloq[pacoteApp]);
                  if (jaEstavaBloqueado) {
                    delete mapaBloq[pacoteApp];
                    bloquearApp = false;
                  } else {
                    mapaBloq[pacoteApp] = true;
                    bloquearApp = true;
                  }
                }

                var novoCsvBloq = mapaParaCsv(mapaBloq);
                var novoCsvLib = mapaParaCsv(mapaLib);
                d.appsBloqueadosCsv = novoCsvBloq;
                d.appsLiberadosCsv = novoCsvLib;
                sincronizarEstadoAppsNoObjeto(d);

                var agoraTs = Date.now();
                var comando = {
                  deviceId: id,
                  acao: 'FIREWALL_APP',
                  pacote: pacoteApp,
                  bloquear: bloquearApp,
                  dadosDesligados: bloqGeral,
                  appsBloqueadosCsv: novoCsvBloq,
                  appsLiberadosCsv: novoCsvLib,
                  timestamp: agoraTs
                };

                registrarAparelhoNaTela(d, false);
                gravarComandoEConfigFirebase(id, comando, d, {
                  dadosDesligados: bloqGeral,
                  appsBloqueadosCsv: novoCsvBloq,
                  appsLiberadosCsv: novoCsvLib,
                  updatedAt: agoraTs
                });
              }

              function reconectarTudo() {
                document.getElementById('statusCentral').textContent = '🔄 Sincronizando...';
                carregarFrotaDoFirebase();
                setTimeout(atualizarBadgeStatusCentral, 1200);
              }

              function simularAparelhoExtra() {
                var modelos = ['Samsung Galaxy A54', 'Motorola Moto G84', 'Xiaomi Redmi Note 13'];
                var idSim = 'CEL-' + Math.floor(Math.random() * 900 + 100);
                var pacoteTeste = {
                  deviceId: idSim, nome: modelos[Math.floor(Math.random() * modelos.length)] + ' • ' + idSim, timestamp: Date.now(),
                  consumoGB: 36.8, planoGB: 43, diaCiclo: 10, rede: '5G Ativo (Vivo)', dadosDesligados: false, appsBloqueadosCsv: '', appsLiberadosCsv: '', velocidade: 45.5, latencia: 18,
                  cidade: 'Jardim Iracema • Fortaleza - CE', endereco: 'Av. Major Assis, Jardim Iracema • Fortaleza - CE', operadora: 'Vivo', lat: -3.7248512, lon: -38.5819421,
                  apps: [
                    { nome: 'WhatsApp', pacote: 'com.whatsapp', totalMB: 1420.5, redeAtiva: 'Transmitindo', emTransmissao: true, usaGeo: true, geoAtiva: true, bloqueado: false },
                    { nome: 'Instagram', pacote: 'com.instagram.android', totalMB: 2310.0, redeAtiva: 'Transmitindo', emTransmissao: true, usaGeo: true, geoAtiva: true, bloqueado: false }
                  ]
                };
                registrarAparelhoNaTela(pacoteTeste, false);
                gravarComandoEConfigFirebase(idSim, null, pacoteTeste, null);
              }

              function renderizarFrota() {
                var chaves = Object.keys(frotaAparelhos);
                var lista = [];
                for (var i = 0; i < chaves.length; i++) { lista.push(frotaAparelhos[chaves[i]]); }
                lista.sort(function(a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });

                var onlineCount = 0, offlineCount = 0, criticosCount = 0, bloqueadosCount = 0, somaGB = 0;

                for (var j = 0; j < lista.length; j++) {
                  var d = lista[j];
                  if (aparelhoEstaOnline(d)) { onlineCount++; } else { offlineCount++; }
                  if (aparelhoEhCritico(d)) { criticosCount++; }
                  if (aparelhoTemBloqueio(d)) { bloqueadosCount++; }
                  somaGB += Number(d.consumoGB || 0);
                }

                document.getElementById('resumoTotalAparelhos').textContent = String(lista.length);
                document.getElementById('resumoOnlineAgora').textContent = String(onlineCount);
                document.getElementById('resumoConsumoFrota').textContent = somaGB.toFixed(2) + ' GB';
                document.getElementById('resumoOfflineCount').textContent = String(offlineCount);

                var elTodos = document.getElementById('ff-todos');
                var elOnline = document.getElementById('ff-online');
                var elOffline = document.getElementById('ff-offline');
                var elCriticos = document.getElementById('ff-criticos');
                var elBloqueados = document.getElementById('ff-bloqueados');
                if (elTodos) elTodos.textContent = 'Todos (' + lista.length + ')';
                if (elOnline) elOnline.textContent = '🟢 Online (' + onlineCount + ')';
                if (elOffline) elOffline.textContent = '⚪ Offline (' + offlineCount + ')';
                if (elCriticos) elCriticos.textContent = '🚨 Criticos ≥80% (' + criticosCount + ')';
                if (elBloqueados) elBloqueados.textContent = '🛡️ Bloqueados (' + bloqueadosCount + ')';

                var listaFiltrada = lista.filter(function(item) {
                  if (filtroFrotaAtual === 'online' && !aparelhoEstaOnline(item)) return false;
                  if (filtroFrotaAtual === 'offline' && aparelhoEstaOnline(item)) return false;
                  if (filtroFrotaAtual === 'criticos' && !aparelhoEhCritico(item)) return false;
                  if (filtroFrotaAtual === 'bloqueados' && !aparelhoTemBloqueio(item)) return false;

                  if (termoBuscaFrota.length > 0) {
                    var alvo = (
                      String(item.nome || '') + ' ' +
                      String(item.deviceId || '') + ' ' +
                      String(item.operadora || '') + ' ' +
                      String(item.cidade || '') + ' ' +
                      String(item.endereco || '')
                    ).toLowerCase();
                    if (alvo.indexOf(termoBuscaFrota) === -1) return false;
                  }
                  return true;
                });

                var container = document.getElementById('listaFrotaContainer');
                if (lista.length === 0) {
                  container.innerHTML = '<div class="sub-info">Nenhum aparelho conectado no momento.</div>';
                  return;
                }
                if (listaFiltrada.length === 0) {
                  container.innerHTML = '<div class="sub-info">Nenhum aparelho encontrado para este filtro ou pesquisa.</div>';
                  return;
                }

                container.innerHTML = listaFiltrada.map(function(item) {
                  var isOnline = aparelhoEstaOnline(item);
                  var bloqueado = Boolean(item.dadosDesligados);
                  var ehCritico = aparelhoEhCritico(item);
                  var mapaIndiv = obterMapaBloqueadosAparelho(item);
                  var mapaLib = obterMapaLiberadosExcecaoAparelho(item);
                  var qtdBloqIndiv = Object.keys(mapaIndiv).length;
                  var qtdLibExc = Object.keys(mapaLib).length;
                  var tempoTexto = bloqueado ? 'Bloqueio Geral' : (isOnline ? 'Online agora' : 'Offline');

                  var planoNum = Number(item.planoGB || 0);
                  var consumoNum = Number(item.consumoGB || 0);
                  var pctUso = planoNum > 0 ? Math.min(100, (consumoNum / planoNum) * 100) : 100;
                  var corBarra = planoNum === 0 ? 'var(--primary)' : (pctUso >= 90 ? 'var(--danger)' : (pctUso >= 80 ? 'var(--warning)' : 'var(--success)'));

                  var txtPlanoCard = planoNum > 0 ? (planoNum + ' GB (' + pctUso.toFixed(0) + '%) • Dia ' + (item.diaCiclo || 1)) : ('Ilimitado • Dia ' + (item.diaCiclo || 1));
                  var btnAppsHtml = bloqueado ? '<button class="btn-success" onclick="alternarFirewallGeralAparelho(\'' + item.deviceId + '\')">🟢 Liberar Todos</button>' : '<button class="btn-danger" onclick="alternarFirewallGeralAparelho(\'' + item.deviceId + '\')">🛡️ Bloquear Todos</button>';

                  var tagAppsInfo = '';
                  if (bloqueado) {
                    tagAppsInfo = qtdLibExc > 0
                      ? '<span class="tag tag-net-on">🟢 ' + qtdLibExc + ' liberado(s) • Restante bloq.</span>'
                      : '<span class="tag tag-net-block">🚫 Todos os apps bloqueados</span>';
                  } else {
                    tagAppsInfo = qtdBloqIndiv > 0
                      ? '<span class="tag tag-net-block">🚫 ' + qtdBloqIndiv + ' app(s) bloq.</span>'
                      : '<span class="tag tag-net-on">📦 Apps liberados</span>';
                  }

                  var tagCriticoHtml = ehCritico ? ' <span class="tag tag-critico">🚨 ' + pctUso.toFixed(0) + '% usado</span>' : '';
                  var btnRemoverOffCard = !isOnline ? '<button class="filtro-btn" style="border-color:var(--danger); color:#f87171;" onclick="removerAparelhoPorId(\'' + item.deviceId + '\')">🗑️ Remover Off</button>' : '';

                  var localCard = item.endereco || item.cidade || 'Localizando...';
                  var classeCard = bloqueado ? 'bloqueado' : (ehCritico ? 'critico' : '');

                  return '<div class="device-card ' + classeCard + '">' +
                    '<div class="device-header"><div><div class="device-name">📱 ' + item.nome + '</div><div class="app-pkg">ID: ' + item.deviceId + ' • Plano: ' + txtPlanoCard + '</div></div>' +
                    '<span class="status-dot ' + (bloqueado ? 'status-blocked' : (isOnline ? 'status-online' : 'status-offline')) + '">' + tempoTexto + '</span></div>' +
                    '<div class="grid-2"><div class="metric-box"><div class="metric-label">Consumo</div><div class="metric-val" style="color:var(--primary);">' + consumoNum.toFixed(2) + ' GB</div>' +
                    '<div class="mini-progress"><div class="mini-progress-fill" style="width:' + pctUso + '%; background:' + corBarra + ';"></div></div></div>' +
                    '<div class="metric-box"><div class="metric-label">Rede</div><div class="metric-val" style="font-size:0.88rem;">' + item.rede + '</div></div></div>' +
                    '<div class="app-badges" style="margin-top: 8px; justify-content:space-between; align-items:center;"><div><span class="tag tag-geo-on">📍 ' + localCard + '</span> ' + tagAppsInfo + tagCriticoHtml + '</div>' + btnRemoverOffCard + '</div>' +
                    '<div class="device-actions"><button onclick="abrirModalRemoto(\'' + item.deviceId + '\')">✏️ Renomear / Plano / Apps</button>' + btnAppsHtml + '</div></div>';
                }).join('');
              }

              function abrirModalRemoto(id) {
                var dados = frotaAparelhos[id];
                if (!dados) return;
                aparelhoRemotoSelecionado = id;
                filtroModalRemoto = 'todos';
                var statusGps = document.getElementById('statusGpsRemoto');
                var btnGps = document.getElementById('btnAtualizarGpsModal');
                if (statusGps) statusGps.textContent = '';
                if (btnGps) btnGps.textContent = '📍 Atualizar GPS Agora';
                preencherModalRemoto(dados, false);
                document.getElementById('modalAparelhoRemoto').style.display = 'block';
              }

              function preencherModalRemoto(d, manterInputsAbertos) {
                document.getElementById('modalTituloAparelho').textContent = '📱 ' + d.nome;
                var txtPlano = Number(d.planoGB || 0) > 0 ? (d.planoGB + ' GB') : 'Ilimitado';
                document.getElementById('modalConsumoPlano').textContent = Number(d.consumoGB || 0).toFixed(2) + ' GB / ' + txtPlano + ' (Dia ' + (d.diaCiclo || 1) + ')';
                document.getElementById('modalRedePing').textContent = d.rede + ' • ' + d.latencia + ' ms';

                var txtEndCompleto = d.endereco ? d.endereco : (d.cidade || 'Localizando...');
                document.getElementById('modalCidadeOp').textContent = txtEndCompleto + ' (' + (d.operadora || 'Rede Movel') + ')';

                var latExib = Number(d.lat || 0).toFixed(6);
                var lonExib = Number(d.lon || 0).toFixed(6);
                var txtPrecisao = (d.precisaoMetros && d.precisaoMetros < 5000) ? (' (±' + d.precisaoMetros + 'm)') : '';
                document.getElementById('modalCoordsGps').textContent = latExib + ', ' + lonExib + txtPrecisao;

                destacarBotoesPlanoModal(d.planoGB || 0);
                if (!manterInputsAbertos) {
                  document.getElementById('modalInputNomeAparelho').value = String(d.nome || '');
                  document.getElementById('modalInputDiaCiclo').value = String(d.diaCiclo || 1);
                }

                document.getElementById('btnAbrirMapaModal').onclick = function() {
                  abrirMapaSeguro(d.lat, d.lon, d.nome);
                };

                var btnToggle = document.getElementById('btnToggleDadosModal');
                btnToggle.textContent = d.dadosDesligados ? '🟢 Liberar Todos os Aplicativos' : '🛡️ Bloquear Todos os Aplicativos';
                btnToggle.className = d.dadosDesligados ? 'btn-success' : 'btn-danger';
                btnToggle.onclick = function() { alternarFirewallGeralAparelho(d.deviceId); };
                filtrarAppsRemoto(filtroModalRemoto);
              }

              function filtrarAppsRemoto(filtro) {
                filtroModalRemoto = filtro;
                document.getElementById('mf-todos').classList.toggle('ativo', filtro === 'todos');
                document.getElementById('mf-geo').classList.toggle('ativo', filtro === 'geo');
                document.getElementById('mf-rede').classList.toggle('ativo', filtro === 'rede');
                document.getElementById('mf-bloq').classList.toggle('ativo', filtro === 'bloq');

                var d = frotaAparelhos[aparelhoRemotoSelecionado];
                var lista = d ? (d.apps || []) : [];
                renderizarListaAppsRemoto(lista, filtro, d);
              }

              function renderizarListaAppsRemoto(listaBase, filtro, dadosAparelho) {
                var container = document.getElementById('modalListaApps');
                var mapaIndiv = obterMapaBloqueadosAparelho(dadosAparelho);
                var mapaLib = obterMapaLiberadosExcecaoAparelho(dadosAparelho);
                var bloqGeral = Boolean(dadosAparelho && dadosAparelho.dadosDesligados);

                var filtrados = (listaBase || []).map(function(a) {
                  var libExcecao = Boolean(mapaLib[a.pacote]);
                  var blqIndiv = Boolean(mapaIndiv[a.pacote]);
                  var estaBloq = bloqGeral ? !libExcecao : blqIndiv;
                  return {
                    nome: a.nome,
                    pacote: a.pacote,
                    totalMB: a.totalMB,
                    usaGeo: a.usaGeo,
                    emTransmissao: !estaBloq && a.emTransmissao,
                    bloqueado: estaBloq,
                    liberadoExcecao: bloqGeral && libExcecao
                  };
                });

                if (filtro === 'geo') { filtrados = filtrados.filter(function(a) { return a.usaGeo; }); }
                else if (filtro === 'rede') { filtrados = filtrados.filter(function(a) { return !a.bloqueado; }); }
                else if (filtro === 'bloq') { filtrados = filtrados.filter(function(a) { return a.bloqueado; }); }

                document.getElementById('modalContadorApps').textContent = filtrados.length + ' apps';
                if (filtrados.length === 0) { container.innerHTML = '<div class="sub-info">Nenhum aplicativo listado.</div>'; return; }

                var devId = dadosAparelho ? dadosAparelho.deviceId : '';
                container.innerHTML = filtrados.map(function(app) {
                  var estaBloq = Boolean(app.bloqueado);
                  var badgeStatus = estaBloq
                    ? '<span class="tag tag-net-block">🚫 Bloqueado</span>'
                    : (app.liberadoExcecao
                        ? '<span class="tag tag-net-on">🟢 Liberado (Exceção)</span>'
                        : '<span class="tag tag-net-on">🟢 Liberado</span>');

                  var btnAppHtml = estaBloq
                    ? '<button class="btn-success btn-app-lock" onclick="alternarBloqueioAppIndividual(\'' + devId + '\', \'' + app.pacote + '\')">🟢 Liberar</button>'
                    : '<button class="btn-danger btn-app-lock" onclick="alternarBloqueioAppIndividual(\'' + devId + '\', \'' + app.pacote + '\')">🚫 Bloquear</button>';

                  return '<div class="app-item ' + (estaBloq ? 'app-bloqueado' : '') + '">' +
                    '<div class="app-main"><div class="app-nome">' + app.nome + '</div><div class="app-pkg">' + app.pacote + '</div>' +
                    '<div class="app-badges">' + badgeStatus + '</div></div>' +
                    '<div class="app-right"><div class="app-consumo">' + app.totalMB + ' MB</div>' + btnAppHtml + '</div></div>';
                }).join('');
              }

              function fecharModalRemoto() { aparelhoRemotoSelecionado = null; document.getElementById('modalAparelhoRemoto').style.display = 'none'; }

              renderizarFrota();
              carregarFrotaDoFirebase();
              setInterval(carregarFrotaDoFirebase, 2500);
            </script>
          </body>
          </html>
          EOF

          # ===================================================================
          # 5. CONFIGURACOES DO GRADLE
          # ===================================================================
          echo "sdk.dir=$HOME/android-sdk" > local.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonitorFrota"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.monitordados'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.monitordados"
                  minSdk 23
                  targetSdk 33
                  versionCode 16
                  versionName "10.4"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

      - name: 5. Compilar APK 1 - Monitor de Dados
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          /tmp/gradle-7.6.4/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Monitor-Dados.apk

      - name: 6. Compilar APK 2 - Painel Central
        run: |
          cp app/src/main/assets/central.html app/src/main/assets/index.html

          sed -i 's/applicationId "com.example.monitordados"/applicationId "com.example.painelcentral"/g' app/build.gradle
          sed -i 's/android:label="Monitor de Dados"/android:label="Painel Central"/g' app/build.gradle 2>/dev/null || true
          sed -i 's/android:label="Monitor de Dados"/android:label="Painel Central"/g' app/src/main/AndroidManifest.xml

          export ANDROID_HOME=$HOME/android-sdk
          /tmp/gradle-7.6.4/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Painel-Central.apk

      - name: 7. Publicar os 2 APKs para Download
        uses: actions/upload-artifact@v4
        with:
          name: APKs-Monitor-e-Central
          path: APKs-Prontos/*.apk
